ology/2016/mar/15/alphago-what-does-google-advanced-software-go-next&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="2" data-paginate="true" data-footer="Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. https://www.doi.org/10.1055/s-0039-3401041" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="2" style="--paginate:true;--footer:Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. https://www.doi.org/10.1055/s-0039-3401041;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="ia-debole-o-ristretta">IA debole (o ristretta)</h3>
<p>L'<strong>IA debole</strong>, anche chiamata IA <strong>ristretta</strong>, è focalizzata su un compito specifico (ad esempio, il riconoscimento di oggetti).</p>
<p>Risolve una classe di problemi specifici attraverso alcune capacità cognitive.</p>
<p>Esempi: recommendation systems, assistenti virtuali, ecc.</p>
<p>Nel 2015, <em>DeepMind</em> sviluppa <a href="https://www.youtube.com/watch?v=WXuK6gekU1Y">AlphaGo</a>, un programma che batte il campione umano di <strong>Go</strong>, un famosissimo gioco da tavolo cinese.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="ia-forte-o-estesa">IA forte (o estesa)</h3>
<p>L’IA <strong>forte</strong> è un tipo di intelligenza artificiale le cui capacità imitano le proprietà adattive e generalizzabili del cervello umano, compresi il ragionamento e l’intuizione.</p>
<p>Conosciuta anche come IA <strong>Generale</strong> (AGI), per ora è pura speculazione e oggetto di ricerca e <a href="https://www.vox.com/the-highlight/23779413/silicon-valleys-ai-religion-transhumanism-longtermism-ea">adorazione religiosa</a>.</p>
<p>Nel 2011, <a href="https://www.youtube.com/watch?v=P18EdAKuC1U">Watson</a> sconfigge campioni umani nel gioco televisivo statunitense <em>Jeopardy</em>.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="tipologie-e-approcci-diversi">Tipologie e approcci diversi</h3>
<ul>
<li data-marpit-fragment="1">IA <strong>simbolica</strong>: si basa sull’uso di simboli e regole esplicite per rappresentare e manipolare la conoscenza, tipicamente utilizzata in sistemi esperti;</li>
<li data-marpit-fragment="2">IA <strong>sub-simbolica</strong>: si basa sull’uso di modelli matematico-probabilistico per rappresentare i processi cognitivi;</li>
<li data-marpit-fragment="3"><strong>Reti neurali artificiali</strong>: ispirate al funzionamento del cervello umano, utilizzate per riconoscere pattern e fare previsioni su grandi quantità di dati;</li>
</ul>

<h3 id="tipologie-e-approcci-diversi-1">Tipologie e approcci diversi</h3>
<ul>
<li data-marpit-fragment="1"><strong>Deep Learning</strong>: sottocategoria delle reti neurali che utilizza strutture più profonde per affrontare compiti più complessi;</li>
<li data-marpit-fragment="2"><strong>Large Language Models</strong>: sistemi di deep learning addestrati su enormi quantità di dati per comprendere, generare e rispondere in linguaggio naturale.</li>
</ul>
<p>Nella loro applicazione reale, spesso approcci diversi vengono mescolati per integrare i punti di forza di ognuno.</p>

<h3 id="approccio-simbolico">Approccio simbolico</h3>
<p>Le AI simboliche cercano di imitare la capacità umana di ragionare elaborando <em>simboli</em>, cioé stringhe di caratteri che rappresentano concetti del mondo reale, secondo regole esplicite.</p>
<p>Questo approccio si basa quindi sulla manipolazione di rappresentazioni comprensibili dall'essere umano e sull'inferenza logica, resa possibile da motori di inferenza che permettono di ricavare nuovi fatti da basi di conoscenza esistenti.</p>

t="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1004.png&quot;);background-size:contain;"><figcaption>&quot;https://medium.com/towards-data-science/symbolic-vs-subsymbolic-ai-paradigms-for-ai-explainability-6e3982c6948a&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="7" data-paginate="true" data-footer="Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. https://www.doi.org/10.1055/s-0039-3401041" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="7" style="--paginate:true;--footer:Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. https://www.doi.org/10.1055/s-0039-3401041;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="approccio-simbolico-1">Approccio simbolico</h3>
<p>Un programma che &quot;ragiona&quot; su come risolvere un problema di logica (come &quot;Se piove, allora prendo l'ombrello&quot;) lavora usando sequenze di simboli come &quot;piovere&quot;, &quot;prendere&quot; e &quot;ombrello&quot; e segue regole di inferenza logica (&quot;Se X, allora Y&quot;) per prendere una decisione.</p>
<p>Un sistema esperto di medicina potrebbe usare simboli come &quot;febbre&quot;, &quot;tosse&quot;, &quot;mal di testa&quot; per fare diagnosi, applicando regole logiche per determinare quale malattia potrebbe corrispondere a questi sintomi.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="approccio-simbolico-2">Approccio simbolico</h3>
<ul>
<li data-marpit-fragment="1">Potente per risolvere problemi complessi in ambienti ben definiti</li>
<li data-marpit-fragment="2">Facile da controllare, correggere e interpretare;</li>
<li data-marpit-fragment="3">Permette di costruire modelli molto trasparenti.</li>
</ul>
<ul>
<li>Dipende da una conoscenza predefinita;</li>
<li>Richiede notevoli sforzi nella sua definizione;</li>
<li>Non adattabile all’incertezza, come quelli che si trovano nel mondo reale.</li>
</ul>

<h3 id="approccio-sub-simbolico">Approccio sub-simbolico</h3>
<p>Le IA sub-simboliche non rappresentano la conoscenza con simboli visibili o comprensibili dall'uomo (come &quot;mela&quot;, &quot;albero&quot;, &quot;rosso&quot;), ma la distribuiscono attraverso le <em>connessioni tra elementi che processano le informazioni</em> che la costituiscono (come i neuroni in un cervello umano).</p>
<p>In altre parole, la conoscenza è codificata in modo implicito attraverso <strong>pattern di attivazione</strong>.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="approccio-sub-simbolico-1">Approccio sub-simbolico</h3>
<p>Questo approccio si basa sull'applicazione di matematica, statistica e analisi dei dati su larga scala per consentire alle macchine di apprendere dall'esperienza.</p>
<p>La premessa è che l'intelligenza umana sia approssimabile identificando correlazioni tra dati, sbagliando e autoregolandosi.</p>
<p>Questo consente alle macchine di generalizzare sulla base di esempi, gestire incertezze e lavorare con dati non strutturati.</p>

</section>

<h3 id="approccio-sub-simbolico-2">Approccio sub-simbolico</h3>
<p>In un cervello, ogni neurone e la sua connessione ad altri neuroni rappresentano in modo molto più astratto la conoscenza.</p>
<p>Una rete neurale &quot;impara&quot; a riconoscere pattern, ma non lo fa in modo esplicito con simboli: non ha un concetto formale di &quot;mela&quot; in termini simbolici, ma riconosce pattern di dati che, per esempio, corrispondono ad una mela in una foto.</p>
<p>Si tratta a tutti gli effenti di una <strong>black box</strong>.</p>

<h3 id="approccio-sub-simbolico-3">Approccio sub-simbolico</h3>
<ul>
<li data-marpit-fragment="1">
<p>Molto più performante, specialmente per compiti in cui bisogna gestire l’incertezza (es. riconoscimento, classificazione, ecc.);</p>
</li>
<li data-marpit-fragment="2">
<p>Molto flessibile, scalabile e adattabile a nuovi dati.</p>
</li>
<li data-marpit-fragment="3">
<p>Non è interpretabile, perché non esiste una rappresentazione esplicita e comprensibile per l’uomo di cosa “sa”;</p>
</li>
<li data-marpit-fragment="4">
<p>Richiede enormi quantità di dati e di potenza hardware per allenarsi.</p>
</li>
</ul>

</section>

<h3 id="esempio-di-approccio-sub-simbolico-machine-learning">Esempio di approccio sub-simbolico: Machine Learning</h3>
<p>L'<em><strong>apprendimento automatico</strong></em> (<em>machine learning</em>) è un sottoinsieme di IA che impara dai dati e fa previsioni sulla base di quello che ha imparato, in assenza di istruzioni esplicite (cioé simboliche).</p>
<p>Questo tipo di tecnologia è diventata la base di molti prodotti e servizi moderni, che consente a questi di adattarsi nel tempo elaborando dati di addestramento e perfezionando la loro logica interna.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="lunit%C3%A0-della-rete-neurale-il-percettrone">L'unità della rete neurale: il percettrone</h3>
<p>Le cellule del cervello umano, i neuroni, formano una rete complessa e altamente interconnessa.</p>
<p>Inviano segnali elettrici l'uno all'altro per elaborare informazioni provenienti dal mondo esterno.</p>
<p>Analogamente, una rete neurale artificiale è fatta di neuroni artificiali che prendono dati esterni come input e producono un risultato.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="lunit%C3%A0-della-rete-neurale-il-percettrone-1">L'unità della rete neurale: il percettrone</h3>
<p>Il modello più semplice di neurone artificiale è il percettrone, proposto da Rosenblatt nel 1958.</p>
<p>Consiste in: uno o più input (dati in entrata); un'unità di calcolo; e un output (dati in uscita).</p>
<p>Il percettrone riceve degli input (numeri), li soppesa, somma i risultati e decide se dare come output un 1 o uno 0 in base ad una soglia predefinita.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="lunit%C3%A0-della-rete-neurale-il-percettrone-2">L'unità della rete neurale: il percettrone</h3>
<p>Ogni dato ha un certo valore numerico (x1, x2, x3, ecc.).</p>
<p>Il valore di ogni dato di input viene moltiplicato con un peso W (un altro valore numerico, generalmente tra 0 e 1, che ne rappresenta l'importanza rispetto al risultato finale).</p>
<p>Tutti i valori pesati vengono sommati insieme, producendo un unico numero (una somma pesata).</p>

lit="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1012.png&quot;);background-size:contain;"><figcaption>&quot;https://www.w3schools.com/ai/ai_perceptrons.asp&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="17" data-paginate="true" data-footer="Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. https://www.doi.org/10.1055/s-0039-3401041" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="17" style="--paginate:true;--footer:Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. https://www.doi.org/10.1055/s-0039-3401041;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="lunit%C3%A0-della-rete-neurale-il-percettrone-3">L'unità della rete neurale: il percettrone</h3>
<p>Questa somma pesata viene passata attraverso una <strong>funzione di attivazione</strong>, che decide se il percettrone si &quot;attiva&quot; (come un neurone che si accende).</p>
<p>Un esempio è la <strong>funzione a gradino</strong>: se la somma è maggiore di una certa soglia, l'output sarà 1 (si, vero, positivo, ecc.); se è minore della soglia, l'output sarà 0 (no, falso, negativo, ecc.).</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. https://www.doi.org/10.1055/s-0039-3401041" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="17" style="" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="18" style="--paginate:true;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1013.png&quot;);"><figcaption>&quot;https://unsplash.com/photos/group-of-boy-band-standing-on-stadium-MV7fWnQ391Y&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="18" data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="18" style="--paginate:true;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="esempio-il-concerto">Esempio: il concerto</h3>
<p>Dobbiamo decisere se andare ad un concerto.</p>
<p>Di solito, dobbiamo considerare una serie di fattori: l’artista è bravo? Il tempo è buono?</p>
<p>Per prendere questa decisione, decidiamo di usare un percettrone.</p>
<p>I fattori da considerare sono i dati di input, ad ognuno dei quali possiamo assegnare un valore binario (0 equivale a “NO”, 1 equivale a “SI”).</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="18" style="" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="5" data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="19" style="--paginate:true;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1013.png&quot;);"><figcaption>&quot;https://unsplash.com/photos/group-of-boy-band-standing-on-stadium-MV7fWnQ391Y&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="19" data-marpit-fragments="5" data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="19" style="--paginate:true;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="esempio-il-concerto-1">Esempio: il concerto</h3>
<ul>
<li data-marpit-fragment="1">L’artista è bravo? = 0 o 1</li>
<li data-marpit-fragment="2">Il tempo è buono? = 0 o 1</li>
<li data-marpit-fragment="3">Siamo con amici? = 0 o 1</li>
<li data-marpit-fragment="4">Servono cibo? = 0 o 1</li>
<li data-marpit-fragment="5">Servono bevande? = 0 o 1</li>
</ul>
<p>Ognuno di questi fattori, però, ha per noi un’importanza diversa.</p>
<p>Quindi, ad ogni input assegnamo anche un peso numerico che rappresenti questa importanza (dove 0 è “importanza nulla” e 1 è “importanza essenziale”).</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="5" data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="19" style="" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="10" data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="20" style="--paginate:true;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1013.png&quot;);"><figcaption>&quot;https://unsplash.com/photos/group-of-boy-band-standing-on-stadium-MV7fWnQ391Y&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="20" data-marpit-fragments="10" data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="20" style="--paginate:true;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="esempio-il-concerto-2">Esempio: il concerto</h3>
<ul>
<li data-marpit-fragment="1">L’artista è bravo? = 0 o 1 (peso = 0.7)</li>
<li data-marpit-fragment="2">Il tempo è buono? = 0 o 1 (peso = 0.6)</li>
<li data-marpit-fragment="3">Siamo con amici? = 0 o 1 (peso = 0.5)</li>
<li data-marpit-fragment="4">Servono cibo? = 0 o 1 (peso = 0.3)</li>
<li data-marpit-fragment="5">Servono alcolici? = 0 o 1 (peso = 0.4)</li>
</ul>
<p>Ora, diciamo che:</p>
<ul>
<li data-marpit-fragment="6">L’artista è bravo = 1</li>
<li data-marpit-fragment="7">Il tempo non è buono = 0</li>
<li data-marpit-fragment="8">Siamo con amici = 1</li>
<li data-marpit-fragment="9">Non servono cibo = 0</li>
<li data-marpit-fragment="10">Servono alcolici = 1</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="10" data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="20" style="" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="5" data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="21" style="--paginate:true;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1013.png&quot;);"><figcaption>&quot;https://unsplash.com/photos/group-of-boy-band-standing-on-stadium-MV7fWnQ391Y&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="21" data-marpit-fragments="5" data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="21" style="--paginate:true;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="esempio-il-concerto-3">Esempio: il concerto</h3>
<p>Diciamo anche che la nostra soglia da considerare per prendere la decisione sia 1.5: sotto la soglia, l’output è 0 (“non vado al concerto”); sopra la soglia, l’output è 1 (“vado al concerto”).</p>
<p>Moltiplichiamo ogni input per il peso che gli abbiamo assegnato:</p>
<ul>
<li data-marpit-fragment="1">L’artista è bravo = 1 * 0.7 = 0.7</li>
<li data-marpit-fragment="2">Il tempo non è buono = 0 * 0.6 = 0</li>
<li data-marpit-fragment="3">Siamo con amici = 1 * 0.5 = 0.5</li>
<li data-marpit-fragment="4">Non servono cibo = 0 * 0.3 = 0</li>
<li data-marpit-fragment="5">Servono alcolici = 1 * 0.4 = 0.4</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="5" data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="21" style="" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="22" style="--paginate:true;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1013.png&quot;);"><figcaption>&quot;https://unsplash.com/photos/group-of-boy-band-standing-on-stadium-MV7fWnQ391Y&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="22" data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="22" style="--paginate:true;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="esempio-il-concerto-4">Esempio: il concerto</h3>
<p>Sommandoli, otteniamo: 0.7 + 0 + 0.5 + 0 + 0.4 = 1.6</p>
<p>La somma dei valori pesati è 1.6, e la soglia che abbiamo stabilito è 1.5.</p>
<p>Dato che 1.6 &gt; 1.5, l’output è 1, quindi andrò al concerto.</p>
<p>Nota: il criterio per stabilire la soglia dipende dal dominio del problema e dalle preferenze di chi sviluppa. Si tratta di una decisione arbitraria effettuata su basi empiriche (esperienza), su dati (in un processo di addestramento), ecc.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="22" style="" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="23" style="--paginate:true;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1013.png&quot;);"><figcaption>&quot;&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="23" data-paginate="true" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="23" style="--paginate:true;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="esempio-il-concerto-5">Esempio: il concerto</h3>
<p>Esiste anche il concetto di <strong>bias</strong>, un peso extra slegato dagli input, una sorta di &quot;assunto di partenza&quot; che viene aggiustato autonomamente per spostare la soglia di decisione in maniera più flessibile e adattabile.</p>
<p>Nella realtà, la decisione non dipende solo dai fattori esterni, ma anche dalla nostra <strong>predisposizione di base</strong> (amiamo andare ai concerti, o preferiamo stare a casa?)</p>
<p>Il <strong>bias</strong> rappresenta matematicamente questa inclinazione, sostituendo la soglia e portando il confronto sempre a zero: <code>Somma dei pesi + Bias &gt; 0</code>.</p>
</section>

Fallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="esempio-il-concerto-6">Esempio: il concerto</h3>
<p>Invece di dire &quot;la somma deve superare la soglia di 1.5&quot;, trasformiamo la soglia in un bias negativo di <strong>-1.5</strong> (che rappresenta, ad esempio, la naturale fatica di uscire di casa la sera).</p>
<p>Il nuovo calcolo diventa:</p>
<ul>
<li data-marpit-fragment="1">Somma dei valori pesati = 1.6</li>
<li data-marpit-fragment="2">Bias (resistenza a uscire) = -1.5</li>
</ul>
<p>Totale: 1.6 - 1.5 = <strong>0.1</strong></p>
<p>Dato che 0.1 è maggiore di 0, l'output è 1: andrò al concerto.</p>
</section>

ion>&quot;https://commons.wikimedia.org/w/index.php?curid=24913461&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="25" data-marpit-fragments="3" data-paginate="true" data-footer="Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. https://www.doi.org/10.1055/s-0039-3401041" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="25" style="--paginate:true;--footer:Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. https://www.doi.org/10.1055/s-0039-3401041;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="reti-neurali-artificiali">Reti neurali artificiali</h3>
<p>Le <em><strong>artificial neural networks</strong></em> sono modelli computazionali composti da gruppi di neuroni artificiali organizzati in livelli.</p>
<p>Ogni neurone in un livello fa un calcolo sui dati che riceve e poi decide se attivarsi o meno, sulla base degli elementi che abbiamo già visto.</p>
<ul>
<li data-marpit-fragment="1">Livello di input ;</li>
<li data-marpit-fragment="2">Uno o più livelli intermedi o nascosti;</li>
<li data-marpit-fragment="3">Livello di output.</li>
</ul>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

pit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1014.png&quot;);background-size:contain;"><figcaption>&quot;https://www.edureka.co/blog/what-is-a-neural-network/&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="26" data-paginate="true" data-footer="Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. https://www.doi.org/10.1055/s-0039-3401041" data-theme="1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9" lang="en-GB" data-marpit-pagination="26" style="--paginate:true;--footer:Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. https://www.doi.org/10.1055/s-0039-3401041;--theme:1ruzp9fj25xahs7qtsznl8l0v1oxijn8aoyg5z39uig9;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="38" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="reti-neurali-artificiali-1">Reti neurali artificiali</h3>
<p>Ogni neurone ad ogni livello lavora con un <strong>microtratto o caratteristica</strong> (<em>feature</em>), ovvero una singola proprietà misurabile dei dati forniti in input o estratti nei livelli nascosti.</p>
<p>Non ha senso guardare un singolo neurone e pensare che rappresenti qualcosa di definito come &quot;gatto&quot;, &quot;cane&quot;, &quot;mela&quot;, &quot;rosso&quot;, &quot;peso&quot;, &quot;10cm&quot;.</p>
<p>I neuroni nei primi strati potrebbero identificare caratteristiche di base come bordi, angoli e forme semplici.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="reti-neurali-artificiali-2">Reti neurali artificiali</h3>
<p>I neuroni in strati più profondi potrebbero combinare queste informazioni per identificare forme più complesse, come occhi, orecchie o il corpo di un animale.</p>
<p>Infine, gli strati finali della rete neurale potrebbero combinare tutte queste informazioni per decidere se l'immagine rappresenta un &quot;gatto&quot; o un &quot;cane&quot;.</p>
<p>Anche se noi progettiamo la rete, i neuroni nei livelli nascosti non sono “programmati” per compiere operazioni specifiche come accade in un programma tradizionale.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="reti-neurali-artificiali-3">Reti neurali artificiali</h3>
<p>Invece, attraverso il processo di addestramento, i pesi dei neuroni vengono aggiustati in modo che la rete impari a riconoscere pattern nei dati.</p>
<p>Ogni neurone nei layer nascosti impara a rappresentare una piccola parte di un concetto. Tuttavia, questi pattern non sono immediatamente interpretabili.</p>
<p>Non sappiamo esattamente cosa ogni neurone sta “vedendo”, ma piuttosto possiamo osservare come il risultato finale si adatti correttamente al nostro obiettivo.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="reti-neurali-artificiali-4">Reti neurali artificiali</h3>
<p>Prendiamo l'immagine di una foglia. Vogliamo capire se la foglia è sana o malata. Decidiamo di utilizzare una rete neurale.</p>
<p>L'immagine è fatta di pixel, e ogni pixel ha un valore numerico che rappresenta il colore del pixel stesso. Quindi, un'immagine può essere convertita in un insieme strutturato di valori numerici.</p>
<p>Una volta che l'immagine è trasformata in numeri, questi numeri vengono passati come input alla rete neurale.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="reti-neurali-artificiali-5">Reti neurali artificiali</h3>
<p>Ogni neurone nei layer nascosti prende dei numeri in ingresso (che sono i pixel dell'immagine), li combina con i pesi, e poi applica una funzione di attivazione per determinare se deve attivarsi o meno. Se i numeri passano bruscamente da alti (chiaro) a bassi (scuro), la rete ha rilevato probabilmente un bordo.</p>
<p>I layer nascosti quindi trasformano questi numeri di input in rappresentazioni più astratte. Se rileva un bordo orizzontale che si unisce a uno verticale, ha trovato forse un angolo.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="reti-neurali-artificiali-6">Reti neurali artificiali</h3>
<p>Ad esempio, mentre nel primo strato la rete potrebbe rilevare semplici caratteristiche come i bordi della foglia, nei layer successivi la rete potrebbe iniziare a riconoscere caratteristiche più complesse come la forma della foglia o eventuali macchie che indicano la presenza di malattie.</p>
<p>L'output finale viene prodotto dal livello di output, che di solito è un singolo neurone (o più neuroni, a seconda del tipo di classificazione).</p>

</section>

<h3 id="reti-neurali-artificiali-7">Reti neurali artificiali</h3>
<p>Nel caso della classificazione della foglia come sana o malata, l'output sarà una probabilità tra 0 e 1, che indica quanto è probabile che l'immagine della foglia sia sana (ad esempio, 0.8 = 80% di probabilità che la foglia sia sana).</p>
<p>All'inizio, i numeri sono del tutto casuali, quindi l'IA non vede nulla e sbaglia a riconoscere l'immagine. Ma, per ridurre questo errore finale, modifica a ritroso i valori, e impara da solo a ridurre il più possibile l'errore.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="tipi-di-machine-learning">Tipi di Machine Learning</h3>
<p>L’apprendimento è un processo iterativo che consiste nell’ottimizzazione progressiva dei parametri che definiscono il modello di IA.</p>
<ul>
<li data-marpit-fragment="1"><strong>Supervisionato</strong>: l’IA viene addestrata su dati preventivamente identificati da un essere umano;</li>
<li data-marpit-fragment="2"><strong>Non supervisionato</strong>: l’IA viene addestrata su dati non identificati;</li>
<li data-marpit-fragment="3"><strong>Per rinforzo</strong>: l’IA apprende sulla base di penalità o ricompense ricevute dall’ambiente in cui si trova ad agire.</li>
</ul>

<h3 id="tipi-di-machine-learning-1">Tipi di Machine Learning</h3>
<p>L’addestramento consiste nel provare, fare errori, e correggerli tramite la <strong>retropropagazione</strong>, un meccanismo per cui la rete regola i vari pesi tra neuroni per migliorare il proprio risultato.</p>
<p>L’addestramento è poi seguito da una fase successiva di <strong>testing</strong>, in cui la rete svolge l’attività per cui è stata addestrata su nuovi dati che non aveva mai visto prima.</p>
<footer>Peng, J., Jury, E. C., Dönnes, P., &amp; Ciurtin, C. (2021). Machine learning techniques for personalised medicine approaches in immune-mediated chronic inflammatory diseases: applications and challenges. Frontiers in pharmacology, 12, 720694. <a href="http://dx.doi.org/10.3389/fphar.2021.720694">http://dx.doi.org/10.3389/fphar.2021.720694</a></footer>
</section>

<h3 id="apprendimento-supervisionato">Apprendimento supervisionato</h3>
<p>In fase di addestramento, vengono forniti i dati su cui allenarsi (es. immagini da classificare a seconda che contengano gatti oppre cani).</p>
<p>Anche la risposta corretta viene fornita all'IA (es. a tutte le immagini di cani, viene associata l’etichetta &quot;cane&quot;; a tutte le immagini di gatti, viene associata l’etichetta &quot;gatto&quot;).</p>
<p>Dopo l'addestramento, l'IA è in grado di riconoscere autonomamente gatti e cani nelle foto.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="apprendimento-non-supervisionato">Apprendimento non-supervisionato</h3>
<p>In fase di apprendimento della rete, vengono forniti solo dati senza la risposta corretta.</p>
<p>L'IA individua da sola regolarità statistiche presenti nei dati (es. la conformazione del muso, la dimensione, i colori, ecc.) e li raggruppa in <em>cluster</em> omogenei sulla base di queste regolarità.</p>
<p>Ottimale per i dati grezzi, ma richiede enormi quantità di materiale e di potenza di calcolo.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="apprendimento-per-rinforzo">Apprendimento per rinforzo</h3>
<p>In fase di apprendimento, l’IA esegue azioni e riceve feedback sotto forma di ricompense o penalizzazioni.</p>
<p>L'IA ha l’obiettivo di imparare a scegliere le azioni che massimizzano la ricompensa complessiva nel lungo periodo.</p>
