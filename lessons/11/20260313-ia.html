<h3 id="ia-discriminativa">IA discriminativa</h3>
<p>L'<strong>IA discriminativa</strong> è una tipologia di IA progettata per analizzare dati, classificarli in diversi tipi, prevedendo la loro distribuzione probabilistica rispetto ad un determinato risultato.</p>
<p>Queste IA sono allenate per differenziare, piuttosto che per creare. Per esempio, un'IA discriminativa può determinare se un'immagine contiene un gatto o un cane.</p>
<p>Imparano tramite esempi, e la qualità dei loro risultati dipende dalla diversità e dal volume dei dati di addestramento.</p>
<p>In questa categoria ricadono tutti gli esempi sub-simbolici che abbiamo visto fino adesso.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="ia-generativa">IA generativa</h3>
<p>L'<strong>IA generativa</strong> è una tipologia di IA progettata per creare nuovi contenuti (testi, immagini, musica, video, ecc.) sulla base di determinate informazioni di partenza (<em><strong>prompt</strong></em>).</p>
<p>I modelli di tipo generativo imparano a produrre nuovi dati con caratteristiche simili ai dati originali, utilizzando modelli di <em>deep learning</em> per identificare i pattern e le relazioni nei dati esistenti.</p>
<p>In questa categoria ricadono gli LLM, ma non tutte le IA generative sono LLM.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="ia-generativa-1">IA generativa</h3>
<p>In genere, l'AI generativa opera in tre fasi:</p>
<ul>
<li data-marpit-fragment="1"><strong>Formazione</strong>, per creare un <em><strong>foundation model</strong></em>, un modello di <em>deep learning</em> che funge da base per diversi tipi di applicazioni di IA generativa.</li>
<li data-marpit-fragment="2"><strong>Ottimizzazione</strong>, per adattare il <em>foundation model</em> a una specifica applicazione.</li>
<li data-marpit-fragment="3"><strong>Generazione, valutazione e riottimizzazione</strong>, per valutare i risultati dell'applicazione e migliorarla continuamente.</li>
</ul>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="il-foundation-model">Il <em>foundation model</em></h3>
<p>Per creare un <em>foundation model</em>, viene addestrato un modello di <em>deep learning</em> su enormi quantità di dati grezzi.</p>
<p>Durante l'addestramento, il modello esegue e valuta milioni di esercizi di “riempimento degli spazi vuoti”, cercando di prevedere l’elemento successivo in una sequenza (es., la parola successiva in una frase, l’elemento successivo in un’immagine, il comando successivo in una riga di codice), e regolandosi continuamente per ridurre al minimo la differenza tra le previsioni e i dati reali.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="il-foundation-model-1">Il <em>foundation model</em></h3>
<p>Il risultato di questo addestramento è una rete neurale di <strong>parametri</strong>, ovvero rappresentazioni codificate di entità e relazioni nei dati, in grado di generare contenuti in modo autonomo in risposta a input o a prompt.</p>
<p>Un foundation model è generalista: sa molte cose su molti tipi di contenuti, ma non è preciso.</p>
<p>Questo processo di addestramento è ad alta intensità di calcolo, dispendioso in termini di tempo e molto costoso.</p>

<h3 id="il-fine-tuning">Il <em>fine-tuning</em></h3>
<p>Il <em><strong>fine-tuning</strong></em> è il processo di alimentazione del <em>foundation model</em> con dati etichettati riferibili ad uno specifico dominio di conoscenza.</p>
<p>Ad esempio, se un team di sviluppo sta tentando di creare un customer service chatbot, creerà centinaia o migliaia di documenti contenenti domande etichettate sul servizio clienti e le risposte corrette, quindi invierà tali documenti al modello.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="esempi-di-genai-transformer">Esempi di genAI: <em>Transformer</em></h3>
<p>Un <em><strong>transformer</strong></em> è un modello basato sull'idea di <em>encoder</em>-<em>decoder</em>.</p>
<p>La sua caratteristica particolare è l'utilizzo di un concetto chiamato <strong>attenzione</strong>, attraverso il quale determinano e si focalizzano su ciò che è più importante dei dati, al fine di acquisire il contesto dei dati e elaborarne intere sequenze contemporaneamente.</p>
<p><a href="https://compute.hivenet.com/post/simplifying-transformer-architecture-a-beginners-guide-to-understanding-ai-magic">https://compute.hivenet.com/post/simplifying-transformer-architecture-a-beginners-guide-to-understanding-ai-magic</a></p>

</section>

<h3 id="un-esempio-ibrido-generative-adversarial-networks-1">Un esempio ibrido: Generative Adversarial Networks (1)</h3>
<p>Immaginiamoci la Gioconda.</p>
<p>Ora, immaginiamoci un falsario che decide di creare un duplicato del dipinto.</p>
<p>Per farlo, il falsario deve capire e imparare come l’autore originario ha creato l’opera.</p>
<p>Immaginiamoci anche un investigatore, il cui obiettivo è quello di scovare il falsario e intuire le regole che questo sta imparando per riprodurre lo stile dell’autore originale.</p>
<footer>Hong, Y., Hwang, U., Yoo, J., &amp; Yoon, S. (2019). How generative adversarial networks and their variants work: An overview. ACM Computing Surveys (CSUR), 52(1), 1-43. <a href="https://doi.org/10.1145/3301282">https://doi.org/10.1145/3301282</a></footer>
</section>

<h3 id="un-esempio-ibrido-generative-adversarial-networks-2">Un esempio ibrido: Generative Adversarial Networks (2)</h3>
<p>Un modello di IA che usa contemporaneamente due reti neurali diverse: un discriminatore (l'investigatore) e un generatore (il falsario).</p>
<p>Durante l'addestramento, il discriminatore impara a discriminare i dati di input (es. riconoscere cifre numeriche nelle immagini).</p>

</section>

<h3 id="un-esempio-ibrido-generative-adversarial-networks-3">Un esempio ibrido: Generative Adversarial Networks (3)</h3>
<p>Alla fine dell'apprendimento, è in grado di classificare nuovi dati di input sulla base del proprio apprendimento (es. determina se l'immagine contiene una cifra sulla base dei pattern appresi in fase di allenamento dalle altre immagini usate).</p>
<p>Il generatore, invece, crea immagini sulla base di dati casuali (noise): inizialmente, le immagini create saranno senza senso.</p>

<h3 id="un-esempio-ibrido-generative-adversarial-networks-4">Un esempio ibrido: Generative Adversarial Networks (4)</h3>
<p>L'output del generatore viene dato in pasto al discriminatore, che verifica che i dati prodotti dal generatore siano passabili rispetto ai dati di addestramento su cui il discriminatore si è allenato.</p>
<p>Se i dati non sono accettabili, il generatore deve correggere i pesi; se invece i dati sono accettabili, il discriminatore è stato &quot;ingannato&quot;, e l’immagine è presa come risultato valido.</p>

<h3 id="pappagalli-stocastici">Pappagalli stocastici</h3>
<p>Immaginiamoci di avere un pappagallo, Lauro, che è molto bravo ad imitare il linguaggio umano e ha una memoria estremamente sviluppata.</p>
<p>Lauro ascolta tutte le conversazioni che avvengono in casa e le può imitare in maniera accurata.</p>
<p>Se Lauro ci sente dire “Ho fame, vorrei proprio un po’ di…”, probabilmente completerà la nostra frase con “… pasta”, o “riso”, o “pizza”.</p>

<h3 id="pappagalli-stocastici-1">Pappagalli stocastici</h3>
<p>La probabilità che generi un output di questo tipo, sulla base del nostro input, è molto più alta rispetto a “bicicletta”, “astuccio” o “filosofia postmoderna”.</p>
<p>Ma Lauro è pur sempre un pappagallo, e quindi non ha coscienza di cosa siano “pasta”, “riso”, “pizza”, “astuccio”.</p>
<p>Quello che fa è basarsi sulla distribuzione statistica del linguaggio e la probabilità che una certa parola o espressione sia seguita da un’altra.</p>

<h3 id="pappagalli-stocastici-2">Pappagalli stocastici</h3>
<p>Lauro è un <strong>pappagallo stocastico</strong>, ovvero un sistema che genera linguaggio in maniera probabilistica, ricombinando pattern estratti dai dati di addestramento.</p>
<p>In altre parole, è un <em><strong>Large Language Model</strong></em> (LLM), un modello di IA generativa basato su reti neurali multistrato e addestrato su enormi quantità di testo per imparare a riconoscere schemi e associazioni propri del linguaggio naturale.</p>

<h3 id="large-language-model">Large Language Model</h3>
<p>Un utente interroga il modello con un <em><strong>prompt</strong></em> e riceve dal modello una risposta.</p>
<p>Ogni volta che chiediamo qualcosa a ChatGPT, l'LLM sottostante (GPT) fa una sola cosa, ripetutamente e velocemente: predire la parola successiva più probabile, sulla base del proprio addestramento.</p>
<p>Sia il <em>prompt</em> che la risposta vengono aggiunti iterativamente ad una <strong>finestra contestuale</strong> che riproduce una forma di &quot;memoria&quot; tenuta dall'IA.</p>

<h3 id="large-language-model-1">Large Language Model</h3>
<p>Il processo di addestramento di un LLM si divide in due fasi principali già viste:</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>Pre-training</strong>: in questa fase, il modello viene addestrato su un grande corpus di testo per imparare a riconoscere le relazioni tra le parole e tra le frasi;</p>
</li>
<li data-marpit-fragment="2">
<p><strong>Fine-tuning</strong>: in questa fase, il modello viene addestrato su un nuovo corpus di testo specifico per migliorare la sua capacità di generare testo in un contesto specifico.</p>
</li>
</ul>
<footer>Lee, T. B., &amp; Trott, S. (2023). Large language models, explained with a minimum of math and jargon. Understanding AI, 27, 2023. <a href="https://www.understandingai.org/p/large-language-models-explained-with">https://www.understandingai.org/p/large-language-models-explained-with</a></footer>
</section>

<h3 id="tokenizzazione-e-embedding">Tokenizzazione e <em>embedding</em></h3>
<p>Affinché l'LLM sia in grado di lavorare col testo, questo deve essere convertito in rappresentazioni numeriche. Questo viene fatto attraverso la <strong>tokenizzazione</strong>, un processo che spezzetta il testo in <em><strong>token</strong></em>, ovvero unità minime di significato.</p>
<p>Ogni token viene poi trasformato in una rappresentazione vettoriale (<em><strong>embedding</strong></em>) proiettata in uno spazio multidimensionale (in pratica, coordinate in uno spazio) in grado di esprimerne la semantica.</p>
<footer>Lee, T. B., &amp; Trott, S. (2023). Large language models, explained with a minimum of math and jargon. Understanding AI, 27, 2023. <a href="https://www.understandingai.org/p/large-language-models-explained-with">https://www.understandingai.org/p/large-language-models-explained-with</a></footer>
</section>

<h3 id="i-parametri">I parametri</h3>
<p>I bias e i pesi delle connessioni tra neuroni che il modello impara durante il processo di addestramento vengono chiamati <strong>parametri</strong>.</p>
<p>Come già visto, si tratta di valori numerici che definiscono il comportamento del modello, ottimizzati per affinarne le capacità.</p>
<p>I parametri vengono inizializzati (spesso in modo casuale) e successivamente ottimizzati per riconoscere le relazioni linguistiche generali presenti nei dati.</p>
<footer>Lee, T. B., &amp; Trott, S. (2023). Large language models, explained with a minimum of math and jargon. Understanding AI, 27, 2023. <a href="https://www.understandingai.org/p/large-language-models-explained-with">https://www.understandingai.org/p/large-language-models-explained-with</a></footer>
</section>

<h3 id="large-language-model-2">Large Language Model</h3>
<p>Nel fine-tuning, i parametri già ottimizzati durante il pre-training vengono adattati ulteriormente su un corpus di testo specifico e più mirato.</p>
<p>Man mano che i parametri aumentano, aumentano le capacità del modello, ma anche le risorse di calcolo richieste.</p>
<ul>
<li data-marpit-fragment="1">GPT-1 ha 117 milioni di parametri;</li>
<li data-marpit-fragment="2">GPT-2 ne ha 1.5 miliardi;</li>
<li data-marpit-fragment="3">GPT-3 ne ha 175 miliardi;</li>
<li data-marpit-fragment="4"><strong>GPT-4 ne ha 1.8 trilioni</strong>.</li>
</ul>
<footer>Lee, T. B., &amp; Trott, S. (2023). Large language models, explained with a minimum of math and jargon. Understanding AI, 27, 2023. <a href="https://www.understandingai.org/p/large-language-models-explained-with">https://www.understandingai.org/p/large-language-models-explained-with</a></footer>
</section>

<h3 id="large-language-model-3">Large Language Model</h3>
<p>Vantaggi: elevatissima scalabilità e flessibilità; resistenza a informazioni incerte, danneggiate o lacunose.</p>
<p>Svantaggi: performance fortemente influenzata dai dati di addestramento, potenziale presenza di allucinazioni (palesi errori nell’output generato), costi di sviluppo e addestramento elevati (legati alle risorse hardware e alla quantità di dati richieste), mancanza di trasparenza, incertezze legate all’AI Act.</p>

<h3 id="uso-di-dati-nella-ia">Uso di dati nella IA</h3>
<p>L’IA si basa su dati storici e, ora, anche su dati sintetici.</p>
<ul>
<li data-marpit-fragment="1">I <strong>dati storici</strong> sono raccolti in dataset “reali”: le canzoni che ho ascoltato, le temperature raccolte negli ultimi 200 anni, i testi estratti da articoli di giornale digitalizzati dalla Library of Congress, ecc.</li>
<li data-marpit-fragment="2">I <strong>dati sintetici</strong> sono generati da un’altra IA e possono aiutare a rappresentare un problema, se ne danno una rappresentazione affidabile.</li>
</ul>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

pit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1012.png&quot;);background-size:contain;"><figcaption>&quot;&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="23" data-paginate="true" data-footer="Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. https://www.doi.org/10.1055/s-0039-3401041" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="23" style="--paginate:true;--footer:Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. https://www.doi.org/10.1055/s-0039-3401041;--theme:85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="ia-e-overfitting">IA e <em>overfitting</em></h3>
<p>L’<em><strong>overfitting</strong></em> è un fenomeno che si verifica quando un’IA impara troppo bene i dettagli dei dati di addestramento, al punto da diventare troppo specifico per quel dataset.</p>
<p>Questo significa che, invece di generalizzare e fare previsioni accurate su nuovi dati, il modello diventa “troppo adattato” a quelle specifiche informazioni, e questo può comportare una bassa precisione sui nuovi dati, a causa della memorizzazione anziché della generalizzazione.</p>
<footer>Razavian, N., Knoll, F., &amp; Geras, K. J. (2020, February). Artificial intelligence explained for nonexperts. In Seminars in musculoskeletal radiology (Vol. 24, No. 01, pp. 003-011). Thieme Medical Publishers. <a href="https://www.doi.org/10.1055/s-0039-3401041">https://www.doi.org/10.1055/s-0039-3401041</a></footer>
</section>

<h3 id="ia-e-allucinazioni">IA e allucinazioni</h3>
<p>Un'<strong>allucinazione</strong> è un output di IA generativa privo di senso o del tutto impreciso ma che, il più delle volte, sembra totalmente plausibile.</p>
<p>L'esempio classico è quello di un avvocato che utilizza uno strumento di IA generativa per effettuare ricerche in preparazione di un caso di alto profilo e lo strumento &quot;produce&quot; diversi casi di esempio, completi di citazioni e attribuzioni, che sono interamente fittizi.</p>
<footer>Ferrer, X., Van Nuenen, T., Such, J. M., Coté, M., &amp; Criado, N. (2021). Bias and discrimination in AI: a cross-disciplinary perspective. IEEE Technology and Society Magazine, 40(2), 72-80. <a href="https://doi.org/10.1109/MTS.2021.3056293">https://doi.org/10.1109/MTS.2021.3056293</a></footer>
</section>

<h3 id="ia-e-discriminazione">IA e discriminazione</h3>
<p>Bias presenti nei dati possono produrre distorsioni nel funzionamento delle IA allenate su questi.</p>
<p>Es. alcuni sistemi di riconoscimento facciale trattano alcune persone in modo più impreciso rispetto alle altre, sulla base della pigmentazione della pelle o della loro struttura facciale.</p>

<h3 id="una-minaccia-per-la-privacy">Una minaccia per la privacy?</h3>
<p>L’intelligence sudcoreana ha accusato DeepSeek di raccolta eccessiva dei dati personali della propria utenza, compresi i pattern di input dalla tastiera (che permettono il riconoscimento dell’individuo), e di invio di questi ad altre aziende cinesi.</p>
<p>Link all’articolo: <a href="https://www.reuters.com/technology/artificial-intelligence/south-korea-spy-agency-says-deepseek-excessively-collects-personal-data-2025-02-10/">https://www.reuters.com/technology/artificial-intelligence/south-korea-spy-agency-says-deepseek-excessively-collects-personal-data-2025-02-10/</a></p>

<h3 id="questioni-etiche">Questioni etiche</h3>
<p>Le IA rischiano di essere:</p>
<ul>
<li data-marpit-fragment="1">Imperscrutabili: non è dato sapere in base a cosa abbiano favorito una decisione;</li>
<li data-marpit-fragment="2">Fuorvianti: hanno preso una decisione in base a dati distorti da bias;</li>
<li data-marpit-fragment="3">Ingiuste: generano effetti iniqui sulle persone;</li>
<li data-marpit-fragment="4">Trasformative: portano a trasformazioni dell’output che minacciano l’autonomia, la privacy o altri diritti individuali;</li>
<li data-marpit-fragment="5">Non-tracciabili: difficoltà nel rintracciare la persona o organizzazione responsabile dell’output.</li>
</ul>

</section>

aw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="ai-act">AI Act</h3>
<p>Nel 2024, il Parlamento Europeo ha approvato l’AI Act, il primo Regolamento al mondo esplicitamente e totalmente dedicato all’IA.</p>
<p>Il testo contiene norme che disciplinano l’attività delle IA, obbligando le aziende che le sviluppano e distribuiscono al rispetto dei diritti e dei valori fondamentali dell’Unione Europea.</p>
<p>Testo integrale: <a href="https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689">https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689</a>.</p>
<p>Sito per non esperti: <a href="https://artificialintelligenceact.eu/">https://artificialintelligenceact.eu/</a></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="33" style="" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="34" style="--paginate:true;--theme:85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1014.png&quot;);background-size:contain;"><figcaption>&quot;&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="34" data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="34" style="--paginate:true;--theme:85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="ai-act-1">AI Act</h3>
<p>Saranno vietati i sistemi di IA che determinano un rischio inaccettabile per la sicurezza, la sussistenza e i diritti delle persone.</p>
<p>In questa categoria rientrano i sistemi che possono manipolare il comportamento umano (es. social scoring e polizia predittiva).</p>
<p>Esempio di social scoring: <a href="https://scenarieconomici.it/wp-content/uploads/2021/08/scs5.png">https://scenarieconomici.it/wp-content/uploads/2021/08/scs5.png</a></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="34" style="" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="35" style="--paginate:true;--theme:85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1014.png&quot;);background-size:contain;"><figcaption>&quot;&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="35" data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="35" style="--paginate:true;--theme:85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="ai-act-2">AI Act</h3>
<p>Il regolamento considera ad alto rischio un numero limitato di sistemi di IA che possono avere ripercussioni negative sulla sicurezza delle persone o sui loro diritti fondamentali.</p>
<p>Es. identificazione biometrica; riconoscimento delle emozioni; valutazione dell’occupazione; determinare l’accesso a servizi e a prestazioni pubblici e privati essenziali.</p>
<p>Prima di immettere un sistema di IA ad alto rischio sul mercato dell’UE, o di farlo entrare in servizio, i fornitori dovranno sottoporlo, in particolare, a una valutazione.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="35" style="" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="36" style="--paginate:true;--theme:85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1014.png&quot;);background-size:contain;"><figcaption>&quot;&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="36" data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="36" style="--paginate:true;--theme:85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="ai-act-3">AI Act</h3>
<p>I sistemi di IA a basso rischio (come videogiochi o filtri spam) saranno esenti da obblighi.</p>
<p>A prescindere dal livell odi pericolosità, gli utenti dovranno essere consapevoli del fatto che stanno interagendo con una macchina.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="36" style="" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="37" style="--paginate:true;--theme:85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1014.png&quot;);background-size:contain;"><figcaption>&quot;&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="37" data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="37" style="--paginate:true;--theme:85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="ia-e-cultura">IA e cultura</h3>
<p>Nell’AI Act europeo, la cultura è espressamente menzionata fra gli ambiti al cui sviluppo l’IA è chiamata a concorrere.</p>
<p>A livello nazionale si richiamano le potenzialità dell’IA, ma si evidenzia anche come “digitalizzare beni non metadatati e/o descritti sia fortemente sconsigliato”.</p>
<p>Vengono ripresi e rivisti concetti fondamentali come l’originalità (con ripercussioni anche sul concetto di bene digitale come replica o copia dell’originale fisico) e il copyright.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="37" style="" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="38" style="--paginate:true;--theme:85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1014.png&quot;);background-size:contain;"><figcaption>&quot;&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="38" data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="38" style="--paginate:true;--theme:85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="ia-e-cultura-1">IA e cultura</h3>
<p>I fornitori dovranno assicurarsi che gli output siano esplicitamente etichettati come prodotti di IA.</p>
<p>I fornitori dovranno pubblicare una descrizione sufficientemente dettagliata dei dati utilizzati per l’addestramento dei propri modelli.</p>
<p>I detentori dei diritti potranno espressamente riservarsi il diritto di utilizzo delle proprie opere (in teoria)… ma come si fa con i modelli già addestrati?</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" data-marpit-pagination="38" style="" data-marpit-pagination-total="39" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" style="--theme:85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/1000.png&quot;);"><figcaption>&quot;&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="39" data-theme="85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd" lang="en-GB" style="--theme:85aku89h9kvni9xk3fo4hr5vfjlk3g33baw7l9b1fqzd;--marpit-advanced-background-split:50%;" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
