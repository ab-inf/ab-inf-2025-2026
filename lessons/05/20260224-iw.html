plash&quot;&gt;Unsplash&lt;/a&gt;&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="3" data-paginate="true" data-footer="An Overview of HTTP. In MDN Web Docs. &lt;a href=&quot;https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview&quot;&gt;https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview&lt;/a&gt;" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="3" style="--paginate:true;--footer:An Overview of HTTP. In MDN Web Docs. &lt;a href=&quot;https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview&quot;&gt;https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview&lt;/a&gt;;--theme:wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="cos%C3%A8-un-protocollo">Cos'è un protocollo?</h3>
<p>Per comunicare, gli elementi all’interno di un sistema devono seguire regole comuni.</p>
<p>Un protocollo è un insieme di regole e di messaggi che governano la comunicazione tra due entità.</p>
<p>La definizione di ogni protocollo consiste nel fornire un insieme di regole non ambigue, definendo i messaggi che possono essere scambiati tra entità, il loro significato e le azioni da intraprendere in ogni situazione (es. semaforo).</p>
<footer>An Overview of HTTP. In MDN Web Docs. <a href="https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview">https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview</a></footer>
</section>

<h3 id="cos%C3%A8-un-protocollo-1">Cos'è un protocollo?</h3>
<p>Un protocollo deve essere espresso in un linguaggio comprensibile alle entità per favorire la comunicazione, con:</p>
<ul>
<li data-marpit-fragment="1">Una <strong>sintassi</strong> da seguire per costruire i messaggi;</li>
<li data-marpit-fragment="2">Delle regole interpretative del messaggio, per definire la <strong>semantica</strong> dei messaggi;</li>
<li data-marpit-fragment="3">Dei <strong>meccanismi per sincronizzare</strong> la comunicazione;</li>
<li data-marpit-fragment="4">Dei <strong>meccanismi per correggere e/o gestire</strong> eventuali errori.</li>
</ul>

</section>

<h3 id="il-protocollo-http">Il protocollo HTTP</h3>
<p>L'<em><strong>HyperText Transfer Protocol</strong></em> (HTTP) è un protocollo di comunicazione utilizzato per il trasferimento di dati tra un client e un server su una rete.</p>
<p>HTTP standardizza come client e server comunicano tramite il metodo richiesta-risposta.</p>
<p>Tra il client e il server ci sono numerosi intermediari, collettivamente chiamati <strong>proxy</strong>, che eseguono diverse operazioni per migliorare le prestazioni e la sicurezza (gateway, cache, ecc.).</p>

<h3 id="la-struttura-di-un-messaggio-http">La struttura di un messaggio HTTP</h3>
<ul>
<li>Una <strong>testa</strong> composta da:
<ul>
<li data-marpit-fragment="1">Una <strong>riga iniziale</strong> (di richiesta o di risposta);</li>
<li data-marpit-fragment="2">Un insieme di <strong>intestazioni opzionali</strong> (o header) che specificano la richiesta o descrivono il corpo del messaggio;</li>
</ul>
</li>
<li>Una <strong>riga vuota</strong> che separa la testa dal corpo del messaggio;</li>
<li>Un <strong>corpo opzionale</strong> (o body o payload) con il contenuto del messaggio.</li>
</ul>

reignObject><foreignObject width="50%" height="720"><section id="9" data-marpit-fragments="2" data-paginate="true" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="9" style="--paginate:true;--theme:wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-metodi-get-e-delete">I metodi GET e DELETE</h3>
<ul>
<li data-marpit-fragment="1">
<p>Il metodo <code>GET</code> richiede una rappresentazione di una risorsa. <code>GET</code> viene usato solo per richiedere dati, e non deve contenere un corpo. Nell'esempio, la richiesta richiede la risorsa al percorso <code>example.com/contact</code>.</p>
</li>
<li data-marpit-fragment="2">
<p>Il metodo <code>DELETE</code> chiede al server di rimuovere una risorsa. <code>DELETE</code> viene usato solo per eliminare dati, e non deve contenere un corpo. Nell'esempio, la richiesta chiede l'eliminazione della risorsa <code>file.html</code>.</p>
</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="2" data-paginate="true" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="9" style="" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="2" data-paginate="true" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="10" style="--paginate:true;--theme:wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="vertical"><figure style="background-image:url(&quot;img/0510.png&quot;);background-size:auto;"><figcaption>&quot;https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods/POST&quot;</figcaption></figure><figure style="background-image:url(&quot;img/0511.png&quot;);background-size:contain;"><figcaption>&quot;https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods/PUT&quot;</figcaption></figure><figure style="background-image:url(&quot;img/0512.png&quot;);background-size:contain;"><figcaption>&quot;https://developer.mozilla.org/en-US/docs/Glossary/Idempotent&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="10" data-marpit-fragments="2" data-paginate="true" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="10" style="--paginate:true;--theme:wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-metodi-post-e-put">I metodi POST e PUT</h3>
<ul>
<li data-marpit-fragment="1">
<p>Il metodo <code>POST</code> manda dati al server per <em>creare</em> una nuova risorsa. Nell'esempio, la richiesta manda dati in coppie <code>chiave=valore</code>, con ogni coppia separata dal <code>&amp;</code>.</p>
</li>
<li data-marpit-fragment="2">
<p>Il metodo <code>PUT</code> manda dati al server per <em>creare o modificare</em> una risorsa. Nell'esempio, la richiesta manda dati a <code>example.com/new.html</code> col contenuto <code>&lt;p&gt;New File&lt;/p&gt;</code>.</p>
</li>
</ul>
<p>La differenza tra i due è che <code>PUT</code> è <strong>idempotente</strong>: l'effetto chi chiamarlo una volta è uguale all'effetto di chiamarlo più volte. <code>POST</code> <strong>non</strong> è idempotente.</p>
</section>

ject width="50%" height="720"><section id="11" data-marpit-fragments="4" data-paginate="true" data-footer="HTTP Messages. In MDN Web Docs. &lt;a href=&quot;https://developer.mozilla.org/en-US/docs/Web/HTTP/Messages&quot;&gt;https://developer.mozilla.org/en-US/docs/Web/HTTP/Messages&lt;/a&gt;" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="11" style="--paginate:true;--footer:HTTP Messages. In MDN Web Docs. &lt;a href=&quot;https://developer.mozilla.org/en-US/docs/Web/HTTP/Messages&quot;&gt;https://developer.mozilla.org/en-US/docs/Web/HTTP/Messages&lt;/a&gt;;--theme:wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="la-risposta-http">La risposta HTTP</h3>
<p><strong>Testa</strong>: una riga di risposta contenente</p>
<ul>
<li data-marpit-fragment="1">la versione del protocollo usato;</li>
<li data-marpit-fragment="2">il <strong>codice di stato</strong> (<em>status code</em>);</li>
<li data-marpit-fragment="3">il <strong>messaggio di stato</strong>;</li>
<li data-marpit-fragment="4">le <strong>intestazioni</strong> contenenti varie informazioni per la comunicazione.</li>
</ul>
<p>Un'eventuale <strong>riga vuota</strong> (nell'immagine non c'è).</p>
<p>Un eventuale <strong>corpo</strong> (nell'immagine non c'è).</p>

</section>

g4vr99k8x6bluxh;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-codici-di-stato-1xx">I codici di stato: 1XX</h3>
<p>Risposte informative preliminari o di diagnostica (molto rare, di solito non usate).</p>
<p>Esempi:</p>
<ul>
<li data-marpit-fragment="1">
<p><code>100 Continue</code>: il server dice al client che può continuare la richiesta.</p>
</li>
<li data-marpit-fragment="2">
<p><code>101 Switching Protocols</code>: il server dice al client il protocollo su cui si sta spostando.</p>
</li>
<li data-marpit-fragment="3">
<p><code>102 Processing</code>: il server dice al client che ha ricevuto la richiesta ma non sa ancora lo stato.</p>
</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="3" data-paginate="true" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="12" style="" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="3" data-paginate="true" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="13" style="--paginate:true;--theme:wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0515.png&quot;);background-size:contain;"><figcaption>&quot;https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/200&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="13" data-marpit-fragments="3" data-paginate="true" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="13" style="--paginate:true;--theme:wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-codici-di-stato-2xx">I codici di stato: 2XX</h3>
<p>La richiesta è stata ricevuta, compresa, accettata e elaborata con successo dal server.</p>
<p>Esempi:</p>
<ul>
<li data-marpit-fragment="1"><code>200 OK</code>: la richiesta ha avuto successo, con diversi significati a seconda del metodo HTTP della richiesta:
<ul>
<li data-marpit-fragment="2"><code>GET</code>: la risorsa è stata presa e mandata al client;</li>
<li data-marpit-fragment="3"><code>PUT</code> o <code>POST</code>: la risorsa è stata creata o modificata nel server.</li>
</ul>
</li>
</ul>
</section>

:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-codici-di-stato-3xx">I codici di stato: 3XX</h3>
<p>Il client deve effettuare ulteriori azioni per completare la richiesta.</p>
<p>Esempi:</p>
<ul>
<li data-marpit-fragment="1">
<p><code>301 Moved Permanently</code>: l'URL della risorsa richiesta è stato cambiato. La risposta contiene il nuovo URL della risorsa.</p>
</li>
<li data-marpit-fragment="2">
<p><code>303 See Other</code>: il server dice al client di prendere la risorsa ad un altro URI con un <code>GET</code>.</p>
</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="2" data-paginate="true" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="14" style="" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="3" data-paginate="true" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="15" style="--paginate:true;--theme:wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0517.png&quot;);background-size:contain;"><figcaption>&quot;https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/404&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="15" data-marpit-fragments="3" data-paginate="true" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="15" style="--paginate:true;--theme:wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-codici-di-stato-4xx">I codici di stato: 4XX</h3>
<p>C'è stato un errore che dipende dalla richiesta del client (spesso derivante da errori nell'URL della richiesta).</p>
<p>Esempi:</p>
<ul>
<li data-marpit-fragment="1">
<p><code>400 Bad Request</code>: il server non processa la richiesta per qualcosa che percepisce come un errore del client.</p>
</li>
<li data-marpit-fragment="2">
<p><code>403 Forbidden</code>: il client non ha i diritti di accesso alla risorsa.</p>
</li>
<li data-marpit-fragment="3">
<p><code>404 Not Found</code>: il server non riesce a trovare la risorsa richiesta.</p>
</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="3" data-paginate="true" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="15" style="" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="2" data-paginate="true" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="16" style="--paginate:true;--theme:wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0518.png&quot;);background-size:contain;"><figcaption>&quot;&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="16" data-marpit-fragments="2" data-paginate="true" data-theme="wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh" lang="en-GB" data-marpit-pagination="16" style="--paginate:true;--theme:wfdk8i501rch18qros6qf6i4hrsjqg4vr99k8x6bluxh;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-codici-di-stato-5xx">I codici di stato: 5XX</h3>
<p>C'è stato un errore che dipende dal server durante il tentativo di elaborazione della richiesta del client.</p>
<p>Esempi:</p>
<ul>
<li data-marpit-fragment="1">
<p><code>500 Internal Server Error</code>: il server ha incontrato una situazione che non sa come gestire.</p>
</li>
<li data-marpit-fragment="2">
<p><code>503 Service Unavailable</code>: il server non è pronto a gestire la richiesta, spesso perché il server è <em>down</em> o sovraccarico.</p>
</li>
</ul>
</section>

<h3 id="pagine-e-siti-web">Pagine e siti Web</h3>
<p>Una <strong>pagina Web</strong> è <em>un documento ipertestuale pubblicato sul World Wide Web</em> e visualizzato dall’utente tramite un client (browser, app, ecc.).</p>
<p>Quindi, un <strong>sito Web</strong> consiste in <em>un insieme di pagine Web (più altri file correlati) che il client richiede ad uno o più server</em> per elaborarli e generarne la visualizzazione sullo schermo del dispositivo.</p>
<p>Le pagine Web sono costruite sulla base dei <em><strong>Web standards</strong></em>.</p>

</section>

<h3 id="gli-standard-del-web">Gli standard del Web</h3>
<p>I <em><strong>Web standard</strong></em> sono le tecnologie utilizzate per costruire siti Web.</p>
<p>Sono definiti da istituzioni come <strong>W3C</strong>, <strong>WHATWG</strong>, <strong>ECMA</strong>, <strong>Khronos</strong>.</p>
<p>Devono seguire questi principi:</p>
<ul>
<li data-marpit-fragment="1">essere <strong>aperti</strong> (liberamente estendibili e utilizzabili);</li>
<li data-marpit-fragment="2">essere <strong>accessibili</strong> a quante più persone possibili e <strong>interoperabili</strong> con quante più tecnologie possibili;</li>
<li data-marpit-fragment="3">non rompere il Web esistente.</li>
</ul>

<h3 id="la-marcatura-del-testo">La marcatura del testo</h3>
<p>La <strong>marcatura</strong> (<em>markup</em>) è <em>l'annotazione del testo per definire esplicitamente i ruoli strutturali e semantici delle parti di cui è costituito</em>.</p>
<p>La marcatura trasforma il testo in una struttura ad albero.</p>
<p>Esistono diversi <em>linguaggi di marcatura</em>, ovvero linguaggi formali che definiscono le regole sintattiche (es., SGML, XML) e/o il vocabolario necessari per la marcatura di un testo.</p>
<footer>Introduction to HTML. In MDN Web Docs. <a href="https://developer.mozilla.org/en-US/docs/Learn/HTML/Introduction_to_HTML">https://developer.mozilla.org/en-US/docs/Learn/HTML/Introduction_to_HTML</a></footer>
</section>

<h3 id="la-marcatura-elementi-e-attributi">La marcatura: elementi e attributi</h3>
<p>Un <strong>elemento</strong> è <em>un termine informativo che esprime la semantica della porzione di testo a cui si riferisce</em>.</p>
<p>In genere, è costituito da un <strong>tag</strong> di apertura (<code>&lt;</code> + <code>elemento</code> + <code>&gt;</code>), un <strong>tag</strong> di chiusura (<code>&lt;/</code> + <code>elemento</code> + <code>&gt;</code>) e un contenuto testuale tra i due.</p>
<p>Un <strong>attributo</strong> è <em>un'informazione aggiuntiva che si riferisce all’elemento a cui viene assegnata</em>, sotto forma di coppia chiave-valore inserita nel tag di apertura.</p>

</section>

<h3 id="introduzione-a-html">Introduzione a HTML</h3>
<p>L'<em><strong>HyperText Markup Language</strong></em> (HTML) è <em>un linguaggio di marcatura che specifica la struttura di una pagina Web</em>.</p>
<p>Una pagina HTML è quindi un documento di testo strutturato secondo determinati elementi e attributi. Ogni cosa, in una pagina HTML, è espressa tramite combinazioni di elementi HTML.</p>
<p>Di fatto è un file, salvato nei formati <code>.htm</code> e <code>.html</code>, servito da un server, e visualizzato da un browser.</p>

<h3 id="lindirizzo-ip">L'indirizzo IP</h3>
<p>Pur usando l’URL per accedere ad una risorsa, il server che la ospita non è direttamente raggiungibile usando il dominio, ma solo attraverso un indirizzo specifico.</p>
<p>Un <strong>indirizzo IP</strong> è <em>un identificativo numerico assegnato ad un dispositivo connesso a Internet</em>.</p>
<p>L'indirizzo IP è essenziale per la comunicazione su Internet, poiché consente ai dispositivi di identificarsi e di scambiarsi informazioni tra di loro.</p>

<h3 id="il-domain-name-system">Il Domain Name System</h3>
<p>Quando un client fa una richesta, deve scoprire l'indirizzo IP associato al dominio che ospita la risorsa richiesta.</p>
<p>Il <em><strong>Domain Name System</strong></em> (DNS) è <em>un sistema di nomenclatura utilizzato per tradurre i nomi di dominio degli indirizzi Web in indirizzi IP numerici</em>.</p>
<p>In pratica, è come un elenco telefonico per Internet che permette agli utenti di trovare i siti web desiderati utilizzando nomi di dominio, invece di usare gli indirizzi IP numerici.</p>
<footer>DNS. In MDN Web Docs. <a href="https://developer.mozilla.org/en-US/docs/Glossary/DNS">https://developer.mozilla.org/en-US/docs/Glossary/DNS</a></footer>

<h3 id="il-transmission-control-protocol">Il Transmission Control Protocol</h3>
<p>Il <em><strong>Transmission Control Protocol</strong></em> è <em>un protocollo che garantisce una trasmissione affidabile dei dati attraverso una rete</em>.</p>
<p>TCP è basato sull'idea della <strong>commutazione di pacchetto</strong>: i dati mandati e ricevuti sono divisi in pacchetti, con la garanzia che questi vengano consegnati correttamente, grazie anche agli indirizzi IP.</p>
<p>Insieme, TCP e IP costituiscono il protocollo TCP/IP.</p>
<footer>TCP. In MDN Web Docs. <a href="https://developer.mozilla.org/en-US/docs/Glossary/TCP">https://developer.mozilla.org/en-US/docs/Glossary/TCP</a></footer>

<h3 id="ricapitolando">Ricapitolando</h3>
<p>Immaginiamoci il Web come una strada. Da una parte, c'è casa nostra: il client. Dall'altra, c'è un negozio: il server.</p>
<p>La strada tra la casa e il negozio è la connessione Internet. Il TCP/IP è il mezzo che usiamo per attraversare la strada. Il DNS è l'indirizzo del negozio. HTTP è la lingua che utilizziamo per chiedere i prodotti. I dati sono i prodotti.</p>
<p>Digitare un URL o cliccare su un link equivale a camminare dalla casa al negozio, prendere i prodotti, e tornare.</p>
