<h3 id="cera-una-volta-un-rapimento">C'era una volta un rapimento...</h3>
<p>Aprile 2014.</p>
<p>276 ragazze di una scuola a <strong>Chibok</strong>, nell'est della Nigeria, vengono rapite dal gruppo terroristico Boko Haram.</p>
<p>Poco dopo, <em>FiveThirtyEight</em> esamina la situazione in un articolo, che verrà fortemente criticato per l'utilizzo dei dati nel grafico e per l'analisi del contenuto.</p>
<p>I numeri provengono dal <em>Global Database of Events, Language and Tone</em> (GDELT), un database che raccoglie dati su eventi e località da migliaia di fonti di notizie, tra cui televisione, stampa e pagine web.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="2" style="" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="3" style="--paginate:true;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0602.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="3" data-paginate="true" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="3" style="--paginate:true;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="rapimenti-o-notizie-sui-rapimenti">Rapimenti o notizie sui rapimenti?</h3>
<p>Invece di mostrare i rapimenti giornalieri in Nigeria, il grafico mostra i <em>rapporti giornalieri</em> di notizie sui rapimenti in Nigeria.</p>
<p>Una tendenza in aumento potrebbe essere dovuta a un numero maggiore di rapimenti, ma anche a un numero maggiore di notizie in generale o a una maggiore attenzione dei media verso il fenomeno.</p>
<p>Il problema maggiore è l’assunzione che un singolo evento nel database corrisponda a un singolo rapimento.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="3" style="" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="4" style="--paginate:true;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0603.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="4" data-paginate="true" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="4" style="--paginate:true;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="di-nuovo-uninterpretazione-sbagliata">Di nuovo, un'interpretazione sbagliata</h3>
<p>In seguito, l’articolo è stato aggiornato, precisando: “Questo post dovrebbe fare riferimento ai rapporti dei media sui rapimenti, non ai rapimenti stessi”.</p>
<p>FiveThirtyEight ha preso i dati nel database GDELT per ciò che erano, senza considerare come i dati venissero raccolti e cosa rappresentasse ogni record nel database.</p>
<p>Di conseguenza, tutto questo ha avuto un impatto anche sulla visualizzazione dei dati, rendendola fuorviante.</p>
</section>

<h3 id="cosa-intendiamo-per-data-literacy">Cosa intendiamo per <em>data literacy</em>?</h3>
<p>La <em>data literacy</em> è la capacità di leggere, creare, usare, comunicare criticamente i dati.</p>
<p>Dipende dai dati, ma anche dal contesto in cui questi vengono creati ed utilizzati.</p>
<p>Nell’ambito umanistico, consiste nel riconoscimento delle potenzialità della ricerca che si sta portando avanti, essere coscienti dei metodi di ricerca utilizzati, e comprendere il contesto e la provenienza dei dati.</p>
<footer>Koltay, T. (2017). Data literacy for researchers and data librarians. Journal of Librarianship and Information Science, 49(1), 3-14. <a href="https://doi.org/10.1177/0961000615616450">https://doi.org/10.1177/0961000615616450</a></footer>
</section>

<h3 id="gli-stessi-dati-possono-essere-organizzati-in-maniera-diversa">Gli stessi dati possono essere organizzati in maniera diversa</h3>
<p><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/31-20e3.svg" data-marp-twemoji=""/> I dati <strong>non-strutturati</strong> mancano formalmente di una struttura organizzata (es. testo libero, immagini, video).</p>
<p><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/32-20e3.svg" data-marp-twemoji=""/> I dati <strong>semi-strutturati</strong> hanno una struttura parziale e flessibile (es. XML).</p>
<p><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/33-20e3.svg" data-marp-twemoji=""/> I dati <strong>strutturati</strong> sono organizzati in uno schema rigido e predefinito (es. database).</p>
<p>(Ma <a href="https://www.techtarget.com/searchdatamanagement/blog/The-Wondrous-World-of-Data/Unstructured-data-is-a-misnomer">non è proprio vero</a>...)</p>

<h3 id="esempio-interessante-i-dati-bibliografici">Esempio interessante: i dati bibliografici</h3>
<p>I dati bibliografici (come i <strong>riferimenti</strong> o le <strong>citazioni</strong>) sono ampiamente analizzati e utilizzati in tutti gli ambiti di ricerca, dalla biologia all'informatica, fino ad arrivare ovviamente alla biblioteconomia e alle DH.</p>

ontain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="9" data-paginate="true" data-footer="Prescott, A. (2013, October). Bibliographic records as humanities big data. In 2013 IEEE International Conference on Big Data (pp. 55-58). IEEE. https://doi.org/10.1109/BigData.2013.6691670" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="9" style="--paginate:true;--footer:Prescott, A. (2013, October). Bibliographic records as humanities big data. In 2013 IEEE International Conference on Big Data (pp. 55-58). IEEE. https://doi.org/10.1109/BigData.2013.6691670;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-dati-hanno-strutture-nascoste">I dati hanno strutture nascoste</h3>
<p>A tutti gli effetti, questo riferimento bibliografico è una <strong>stringa</strong> (in informatica, è il termine utilizzato per riferirsi al testo), quindi un dato <em>non-strutturato</em>.</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/> Ma sappiamo che in realtà un riferimento bibliografico (come anche altre tipologie di testo &quot;semplice&quot;) ha una struttura <em>implicita</em>, determinata dallo stile citazionale scelto, che ci permette di dire una serie di <em>cose</em> su questo dato...</p>
<p>Cosa sono queste <em>cose</em>?</p>
<footer>Prescott, A. (2013, October). Bibliographic records as humanities big data. In 2013 IEEE International Conference on Big Data (pp. 55-58). IEEE. <a href="https://doi.org/10.1109/BigData.2013.6691670">https://doi.org/10.1109/BigData.2013.6691670</a></footer>
</section>

nced-background-container="true" data-marpit-advanced-background-direction="vertical"><figure style="background-image:url(&quot;img/0609.png&quot;);background-size:contain;"><figcaption>&quot;&quot;</figcaption></figure><figure style="background-image:url(&quot;img/0610.png&quot;);background-size:contain;"><figcaption>&quot;&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="10" data-paginate="true" data-footer="Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In &quot;Perspectives on Paradata: Research and Practice of Documenting Process Knowledge&quot; (pp. 1-14). Cham: Springer International Publishing. https://doi.org/10.1007/978-3-031-53946-6_1" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="10" style="--paginate:true;--footer:Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In &quot;Perspectives on Paradata: Research and Practice of Documenting Process Knowledge&quot; (pp. 1-14). Cham: Springer International Publishing. https://doi.org/10.1007/978-3-031-53946-6_1;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="spesso-il-contesto-%C3%A8-pi%C3%B9-importante">Spesso il contesto è più importante</h3>
<p>Nelle discipline umanistiche tendiamo ad avere <em>dati descrittivi e interpretativi di altri dati</em>: per descrivere opere culturali, eventi, collezioni bibliografiche lavoriamo più che altro sulle relazioni e i contesti (sociali, geografici, storici, umani).</p>
<p>In questa prospettiva, un ruolo fondamentale è svolto dai <strong>metadati</strong> che documentano <em>in maniera strutturata</em> i <em>chi</em>, i <em>cosa</em>, i <em>come</em>, i <em>quando</em>, i <em>dove</em>, i <em>perché</em> dei dati.</p>
<footer>Andersson, L., Huvila, I., &amp; Sköld, O. (2024). An Introduction to Paradata. In &quot;Perspectives on Paradata: Research and Practice of Documenting Process Knowledge&quot; (pp. 1-14). Cham: Springer International Publishing. <a href="https://doi.org/10.1007/978-3-031-53946-6_1">https://doi.org/10.1007/978-3-031-53946-6_1</a></footer>
</section>

yat7bnurphkj" lang="en-GB" data-marpit-pagination="11" style="--paginate:true;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-metadati-di-un-oggetto">I metadati di un oggetto</h3>
<p>Ogni volta che viene scattata una foto con un dispositivo digitale, dei <em>metadati</em> vengono creati automaticamente, come:</p>
<ul>
<li data-marpit-fragment="1">Data di creazione;</li>
<li data-marpit-fragment="2">Nome del file;</li>
<li data-marpit-fragment="3">Impostazioni del dispositivo;</li>
<li data-marpit-fragment="4">Geolocalizzazione.</li>
</ul>
<p>Anche un libro è ricco di metadati visibili sulla copertina e nel frontespizio, come:</p>
<ul>
<li data-marpit-fragment="5">Titolo;</li>
<li data-marpit-fragment="6">Autore;</li>
<li data-marpit-fragment="7">Editore.</li>
</ul>
</section>

a, M. (Ed.). (2016). Introduction to metadata. Getty Publications. &lt;a href=&quot;https://www.getty.edu/publications/intrometadata/&quot;&gt;https://www.getty.edu/publications/intrometadata/&lt;/a&gt;" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="12" style="--paginate:true;--footer:Baca, M. (Ed.). (2016). Introduction to metadata. Getty Publications. &lt;a href=&quot;https://www.getty.edu/publications/intrometadata/&quot;&gt;https://www.getty.edu/publications/intrometadata/&lt;/a&gt;;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="dati-su-dati">Dati su dati</h3>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/27a1.svg" data-marp-twemoji=""/> I <strong>metadati</strong> sono <em>dati che descrivono un oggetto informativo e ne documentano alcune caratteristiche</em>.</p>
<p>Esempi di metadati includono l'autore di un libro, il contenuto testuale, la data di pubblicazione, e così via.</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> I metadati possono essere visti come <em>l'insieme di tutto ciò che si può dire su un dato (oggetto informativo) in un determinato momento, a qualsiasi livello di aggregazione</em>.</p>
<footer>Baca, M. (Ed.). (2016). Introduction to metadata. Getty Publications. <a href="https://www.getty.edu/publications/intrometadata/">https://www.getty.edu/publications/intrometadata/</a></footer>
</section>

<h3 id="i-metadati-possono-riferirsi-a-tante-cose">I metadati possono <em>riferirsi a</em> tante cose</h3>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> I metadati costituiscono <em>una forma di <strong>documentazione</strong></em> (di solito strutturata) che descrive o rappresenta le caratteristiche di un oggetto.</p>
<p><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50e.svg" data-marp-twemoji=""/> Quindi, possono essere usati per descrivere tanto gli oggetti <em>fisici</em> (per esempio, frammenti di vasi, reperti archeologici, quadri, libri, persone, ecc.), quanto gli oggetti <em>digitali</em> (per esempio, software, foto, dataset, videogiochi, modelli 3D, ecc.).</p>

</section>

<h3 id="i-metadati-possono-essere-tante-cose">I metadati possono <em>essere</em> tante cose</h3>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> I metadati possono assumere molte <em>forme</em> diverse.</p>
<p><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50e.svg" data-marp-twemoji=""/> A partire da semplice <em>testo libero</em> (per esempio, l'etichetta di un'opera d'arte esposta in un museo), pensato per un utilizzatore umano, i metadati possono esistere anche sotto forma di contenuto codificato in <em>un formato altamente strutturato, standardizzato e comprensibile dalle macchine</em> (per esempio, un file <a href="https://it.wikipedia.org/wiki/ISO_2709">MARC</a>).</p>
<footer>Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. <a href="https://doi.org/10.5281/zenodo.6459832">https://doi.org/10.5281/zenodo.6459832</a></footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="14" style="" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-footer="Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="15" style="--paginate:true;--footer:Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0614.png&quot;);"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="15" data-paginate="true" data-footer="Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="15" style="--paginate:true;--footer:Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-metadati-sono-sempre-associati-ai-dati-che-descrivono">I metadati sono sempre associati ai dati che descrivono</h3>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> I metadati <em>accompagnano ciò che descrivono</em> in vari modi.</p>
<p><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50e.svg" data-marp-twemoji=""/> Possono essere presenti direttamente <em>nei dati stessi</em> (per esempio, un file PDF o un'immagine digitale), oppure possono essere registrati <em>in oggetti separati collegati</em> in qualche maniera ai dati che descrivono (per esempio, file di testo, fogli di calcolo, ma anche una scheda di catalogo o l'etichetta di un'opera esposta in un museo).</p>
<footer>Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. <a href="https://doi.org/10.5281/zenodo.6459832">https://doi.org/10.5281/zenodo.6459832</a></footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="15" style="" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="3" data-paginate="true" data-footer="Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="16" style="--paginate:true;--footer:Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0615.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="16" data-marpit-fragments="3" data-paginate="true" data-footer="Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="16" style="--paginate:true;--footer:Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. &lt;a href=&quot;https://doi.org/10.5281/zenodo.6459832&quot;&gt;https://doi.org/10.5281/zenodo.6459832&lt;/a&gt;;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="esistono-diversi-tipi-di-metadati">Esistono diversi tipi di metadati</h3>
<ul>
<li data-marpit-fragment="1"><strong>Descrittivi</strong>: descrivono dati usando dettagli sul contenuto che permettono a questi dati di essere rintracciabili, identificabili e selezionabili (es. <code>titolo</code>);</li>
<li data-marpit-fragment="2"><strong>Strutturali</strong>: forniscono informazioni sulla costruzione e sull'organizzazione dei dati all'interno della loro collezione (es. <code>indice</code>);</li>
<li data-marpit-fragment="3"><strong>Amministrativi</strong>: permettono la gestione dei dati nel tempo, fornendo informazioni sulle loro origini e le loro modalità di utilizzo (es. <code>licenza</code>).</li>
</ul>
<footer>Australian Research Data Commons (ARDC). (2020). ARDC Metadata Guide. Zenodo. <a href="https://doi.org/10.5281/zenodo.6459832">https://doi.org/10.5281/zenodo.6459832</a></footer>
</section>

<h3 id="con-i-metadati-la-situazione-pu%C3%B2-sfuggire-di-mano-velocemente">Con i metadati, la situazione può sfuggire di mano velocemente</h3>
<p><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50e.svg" data-marp-twemoji=""/> Questo esemplare fisico d’erbario di <em>Cenchrus ciliaris</em> è composto sia dai campioni sia dai metadati che li descrivono. Il codice a barre rimanda a un record digitale contenente metadati relativi al reperto fisico.</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/> La metadatazione è una questione complessa: possiamo descrivere tutto, come vogliamo, e pure su diversi livelli... A quel punto, a cosa serve?</p>
<p>Come ci regoliamo?</p>
<footer>Ram, Sudha &amp; Liu, Jun. (2008). A Semiotics Framework for Analyzing Data Provenance Research. JCSE. 2. 221-248. <a href="http://dx.doi.org/10.5626/JCSE.2008.2.3.221">http://dx.doi.org/10.5626/JCSE.2008.2.3.221</a></footer>
</section>

 data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0617.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="18" data-paginate="true" data-footer="Ulrich, H., Kock-Schoppenhauer, A. K., Deppenwiese, N., Gött, R., Kern, J., Lablans, M., ... &amp; Ingenerf, J. (2022). Understanding the nature of metadata: systematic review. &quot;Journal of medical Internet research&quot;, 24(1), e25440. https://doi.org/10.2196/25440" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="18" style="--paginate:true;--footer:Ulrich, H., Kock-Schoppenhauer, A. K., Deppenwiese, N., Gött, R., Kern, J., Lablans, M., ... &amp; Ingenerf, J. (2022). Understanding the nature of metadata: systematic review. &quot;Journal of medical Internet research&quot;, 24(1), e25440. https://doi.org/10.2196/25440;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="i-metadati-seguono-schemi">I metadati seguono schemi</h3>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/27a1.svg" data-marp-twemoji=""/> Gli <strong>schemi di metadati</strong> sono <em>strutture concettuali che specificano quali metadati utilizzare e secondo quali regole</em>.</p>
<p>Stabiliscono termini, definizioni, regole comuni per facilitare l'interpretazione, la comunicazione, la coerenza, la prevedibilità dei dati.</p>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Uno schema è composto da <strong>elementi</strong>, accompagnati dalle relative definizioni e regole di utilizzo (per esempio, se va utilizzata una stringa o un numero).</p>
<footer>Ulrich, H., Kock-Schoppenhauer, A. K., Deppenwiese, N., Gött, R., Kern, J., Lablans, M., ... &amp; Ingenerf, J. (2022). Understanding the nature of metadata: systematic review. &quot;Journal of medical Internet research&quot;, 24(1), e25440. <a href="https://doi.org/10.2196/25440">https://doi.org/10.2196/25440</a></footer>

="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0618.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="19" data-paginate="true" data-footer="Ulrich, H., Kock-Schoppenhauer, A. K., Deppenwiese, N., Gött, R., Kern, J., Lablans, M., ... &amp; Ingenerf, J. (2022). Understanding the nature of metadata: systematic review. &quot;Journal of medical Internet research&quot;, 24(1), e25440. https://doi.org/10.2196/25440" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" data-marpit-pagination="19" style="--paginate:true;--footer:Ulrich, H., Kock-Schoppenhauer, A. K., Deppenwiese, N., Gött, R., Kern, J., Lablans, M., ... &amp; Ingenerf, J. (2022). Understanding the nature of metadata: systematic review. &quot;Journal of medical Internet research&quot;, 24(1), e25440. https://doi.org/10.2196/25440;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="52" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="esempio-dublin-core">Esempio: Dublin Core</h3>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/27a1.svg" data-marp-twemoji=""/> <em><strong>Dublin Core</strong></em> (DC) è uno degli standard di metadati più semplici e utilizzati, una sorta di minimo comune denominatore.</p>
<p>Viene pensato per descrivere risorse Web (ma è applicabile anche a risorse fisiche), ed è composto da 15 elementi <em>core</em>: <strong>Titolo</strong>, <strong>Autore</strong>, <strong>Soggetto</strong>, <strong>Descrizione</strong>, <strong>Editore</strong>, <strong>Autore secondario</strong>, <strong>Data</strong>, <strong>Tipo</strong>, <strong>Formato</strong>, <strong>Identificatore</strong>, <strong>Fonte</strong>, <strong>Lingua</strong>, <strong>Relazione</strong>, <strong>Copertura</strong>, <strong>Diritti</strong>.</p>
<p>Viene poi esteso in <a href="https://www.dublincore.org/specifications/dublin-core/dcmi-terms/">DC Terms</a>.</p>
<footer>Ulrich, H., Kock-Schoppenhauer, A. K., Deppenwiese, N., Gött, R., Kern, J., Lablans, M., ... &amp; Ingenerf, J. (2022). Understanding the nature of metadata: systematic review. &quot;Journal of medical Internet research&quot;, 24(1), e25440. <a href="https://doi.org/10.2196/25440">https://doi.org/10.2196/25440</a></footer>
</section>

<h3 id="altre-tipologie-di-standard-rilevanti-per-noi-ora">Altre tipologie di standard rilevanti per noi ora</h3>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/27a1.svg" data-marp-twemoji=""/> Standard per i <strong>contenuti</strong> dei dati: definiscono come rappresentare uno specifico tipo di dati a partire dal formato (es. ISO 8601 per le date, o ISO 639-1 per le lingue);</p>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/27a1.svg" data-marp-twemoji=""/> Standard per i <strong>valori</strong> dei dati: definiscono come rappresentare uno specifico tipo di dati a partire da un insieme finito e controllato di opzioni (es. AAT).</p>

<h3 id="come-usare-in-maniera-efficace-i-metadati">Come usare in maniera efficace i metadati?</h3>
<ul>
<li data-marpit-fragment="1">Consistenza con <strong>standard già esistenti</strong> dove possibile;</li>
<li data-marpit-fragment="2">Fornire tutte le informazioni necessarie a <strong>identificare</strong> i dati;</li>
<li data-marpit-fragment="3">Fornire tutte le informazioni necessarie a <strong>descrivere</strong> i dati;</li>
<li data-marpit-fragment="4">Fornire tutte le informazioni necessarie a <strong>ricostruire la storia</strong> dei dati;</li>
<li data-marpit-fragment="5">Fornire tutte le informazioni necessarie ad <strong>accedere</strong> e <strong>utilizzare</strong> i dati.</li>
</ul>
<footer>Ulrich, H., Kock-Schoppenhauer, A. K., Deppenwiese, N., Gött, R., Kern, J., Lablans, M., ... &amp; Ingenerf, J. (2022). Understanding the nature of metadata: systematic review. &quot;Journal of medical Internet research&quot;, 24(1), e25440. <a href="https://doi.org/10.2196/25440">https://doi.org/10.2196/25440</a></footer>
</section>

</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" style="" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" style="--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}">
<h3 id="dati-per-contenuto-cosa-misuriamo">Dati per contenuto (cosa misuriamo)</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Tipo</th>
<th style="text-align:left">Definizione</th>
<th style="text-align:left">Obiettivo nell'analisi</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Testuali</strong></td>
<td style="text-align:left">Stringhe di testo, sequenze di caratteri (es. descrizioni di opere d’arte)</td>
<td style="text-align:left">Analisi linguistica (frequenze, <em>sentiment</em>), identificazione di <em>pattern</em> lessicali, ecc.</td>
</tr>
<tr>
<td style="text-align:left"><strong>Spaziali</strong></td>
<td style="text-align:left">Posizioni geografiche, coordinate (es. localizzazione di beni culturali)</td>
<td style="text-align:left">Analisi di distribuzione geografica e mappatura.</td>
</tr>
<tr>
<td style="text-align:left"><strong>Temporali</strong></td>
<td style="text-align:left">Espressioni di temporalità (es. date, periodi storici)</td>
<td style="text-align:left">Analisi di tendenze, cambiamenti nel tempo e cronologie</td>
</tr>
<tr>
<td style="text-align:left"><strong>Numerici</strong></td>
<td style="text-align:left">Quantità fisiche senza contesto spaziale/temporale (es. altezza, larghezza, misure)</td>
<td style="text-align:left">Calcoli statistici, correlazioni.</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" style="--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}">
<h3 id="dati-per-misurabilit%C3%A0-come-li-trattiamo">Dati per misurabilità (come li trattiamo)</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Tipo</th>
<th style="text-align:left">Definizione</th>
<th style="text-align:left">Obiettivo nell'analisi</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Categorici</strong></td>
<td style="text-align:left">Descrivono caratteristiche non misurabili numericamente e non hanno un ordine intrinseco (es. titoli, tipologie, generi di opere d'arte, ecc.)</td>
<td style="text-align:left">Classificare gli oggetti e determinare la distribuzione (conteggio) tra le categorie.</td>
</tr>
<tr>
<td style="text-align:left"><strong>Quantitativi</strong></td>
<td style="text-align:left">Hanno un significato quantitativo diretto (es. misure, età, ecc.)</td>
<td style="text-align:left">Calcolare medie e correlazioni.</td>
</tr>
<tr>
<td style="text-align:left"><strong>Ordinali</strong></td>
<td style="text-align:left">Simili ai categorici, ma con un ordine implicito e definito (spesso temporale o di scala) (es. anni, livelli di soddisfazione, ecc.)</td>
<td style="text-align:left">Analizzare progressioni, tendenze e ordinamento.</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" style="--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}">
<h3 id="alcuni-tipi-di-analisi">Alcuni tipi di analisi</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Tipo</th>
<th style="text-align:left">Oggetto di analisi</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Statistica</strong></td>
<td style="text-align:left">Caratteristiche dei dati a livello micro (es. singola opera), meso (es. un gruppo di opere) e macro (es. evoluzione delle tendenze artistiche nel corso dei secoli)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Temporale</strong></td>
<td style="text-align:left">Cambiamenti delle variabili nel tempo (es. numero di visitatori di un museo nell’arco di cinque anni)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Geospaziale</strong></td>
<td style="text-align:left">Distribuzione spaziale e geografica dei dati (es. mappatura della posizione di beni culturali sul terriorio)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Tematica</strong></td>
<td style="text-align:left">Variabili categoriche, cioè quelle che appartengono a gruppi distinti senza un ordine intrinseco (es. analisi di categorie, classificazione dei beni in base al periodo storico o alla regione geografica di origine)</td>
</tr>
</tbody>
</table>

 data-marpit-advanced-background-split="right">
<h3 id="cos%C3%A8-la-data-visualization">Cos’è la <em>data visualization</em>?</h3>
<p>La <em>visualizzazione dei dati</em> è il processo di rappresentazione visiva dei dati per facilitare la comprensione e la comunicazione dei risultati della loro analisi.</p>
<p>Chi si occupa di progettare e realizzare visualizzazioni dei dati lo fa per comprendere meglio i dati con cui sta lavorando, oppure per trasmettere informazioni, usando elementi del <em>graphic design</em> come il colore, la tipografia, il <em>layout</em>, la composizione, ecc.</p>
<footer>Midway, S. R. (2020). Principles of effective data visualization. Patterns, 1(9). <a href="https://doi.org/10.1016/j.patter.2020.100141">https://doi.org/10.1016/j.patter.2020.100141</a></footer>
</section>

<h3 id="explanatory-data-analysis"><em>Explanatory Data Analysis</em></h3>
<p>L'<em><strong>Explanatory Data Analysis</strong></em> è <em>un processo di analisi dei dati usato per mostrare e spiegare pattern nei dati ad altre persone</em>.</p>
<p>Chi analizza i dati progetta l'analisi attorno ad una <strong>narrativa</strong>, con l'intenzione di comunicare qualcosa.</p>
<p>Una volta che hanno esplorato i dati e hanno scoperto qualcosa di interessante, vogliono comunicare quel qualcosa ad un pubblico, possibilmente raccontando una <strong>storia</strong>.</p>
<footer>Midway, S. R. (2020). Principles of effective data visualization. Patterns, 1(9). <a href="https://doi.org/10.1016/j.patter.2020.100141">https://doi.org/10.1016/j.patter.2020.100141</a></footer>
</section>

rg/10.7282/T35T3HSK;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="cosa-rende-una-storia-una-buona-storia">Cosa rende una storia una buona storia?</h3>
<p>Da sempre, le storie vengono raccontate per trasmettere conoscenza.</p>
<p>Una buona storia <strong>ci coinvolge</strong>: innesca la nostra curiosità, ci aggancia, ci emoziona.</p>
<p>Ancora più importante, una storia <strong>ci arricchisce</strong>: ci può insegnare qualcosa sul mondo in cui viviamo, può avere una morale che potrebbe mettere in dubbio le nostre convinzioni, può collegare punti e insegnarci l'esistenza di relazioni inaspettate.</p>
<footer>Anderson, K. E. (2010). Storytelling. <a href="https://doi.org/10.7282/T35T3HSK">https://doi.org/10.7282/T35T3HSK</a></footer>
</section>

<h3 id="visualizzare-i-dati-e%C3%A8-raccontare-storie">Visualizzare i dati e/è raccontare storie</h3>
<p>La <em>data visualization</em> insegna qualcosa all'utente finale sui dati e sulla parte di mondo che questi rappresentano, rendendogli il processo di apprendimento il più facile possibile.</p>
<p>Tutti gli elementi di un grafico (tipo, titolo, colori, ecc.) lavorano insieme per rendere la narrativa che vogliamo comunicare chiara, accessibile, richiedendo un minor carico cognitivo da parte dell'utente finale.</p>
<footer>Tong, C., Roberts, R., Borgo, R., Walton, S., Laramee, R. S., Wegba, K., ... &amp; Ma, X. (2018). Storytelling and visualization: An extended survey. Information, 9(3), 65. <a href="https://doi.org/10.3390/info9030065">https://doi.org/10.3390/info9030065</a></footer>

<h3 id="attenzione-al-cognitive-load">Attenzione al <em>cognitive load</em></h3>
<p>Il concetto di <em>carico cognitivo</em> ci aiuta a capire quanto sia facile o difficile per qualcuno comprendere nuove informazioni.</p>
<p>Per esempio: un numero minore di variabili è più facile da capire rispetto ad un numero maggiore di variabili.</p>
<p>Altro esempio: un numero minore di elementi in un grafico, disposti in maniera prevedibile, rendono un grafico più facile da capire.</p>
<footer>Sweller, J. (2011). Cognitive load theory. In Psychology of learning and motivation (Vol. 55, pp. 37-76). Academic Press. <a href="https://doi.org/10.1016/B978-0-12-387691-1.00002-8">https://doi.org/10.1016/B978-0-12-387691-1.00002-8</a></footer>
</section>

<h3 id="attenzione-al-titolo">Attenzione al titolo</h3>
<p>Guidare il lettore nell'interpretazione di un grafico è molto importante.</p>
<p>Il titolo di un grafico è la prima cosa che le persone guardano quando iniziano a leggere un grafico.</p>
<p>Idealmente, il titolo dovrebbe contenere il messaggio principale del grafico in <strong>10 parole o meno</strong>.</p>
<p>Il titolo dovrebbe essere posizionato sopra il grafico, in grandi dimensioni, e non contraddire quanto espresso dal grafico.</p>
</section>

<h3 id="la-scelta-del-grafico-dipende-da-vari-fattori">La scelta del grafico dipende da vari fattori</h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>Tipo di dato</strong> (per esempio, i grafici a barre e a torta sono ideali per rappresentare dati categorici);</p>
</li>
<li data-marpit-fragment="2">
<p><strong>Messaggio</strong> (vogliamo parlare di una deviazione, o una correlazione? Vogliamo parlare di una parte del tutto?)</p>
</li>
<li data-marpit-fragment="3">
<p><strong>Pubblico</strong> (quanto è <em>data literate</em>? Sto parlando con esperti di dominio? Considero anche eventuali disabilità?)</p>
</li>
</ul>
<p><a href="http://ft-interactive.github.io/visual-vocabulary/">http://ft-interactive.github.io/visual-vocabulary/</a></p>

<h3 id="correlazione--causazione">Correlazione != Causazione</h3>
<p>Esiste una forte correlazione tra il consumo di cioccolato e il numero di premi Nobel vinti da un Paese: i Paesi in cui le persone mangiano più cioccolato vincono più premi Nobel.</p>
<p>Questo significa forse che, per vincere più Premi Nobel, i governi dovrebbero iniziare a implementare campagne di promozione del cioccolato?</p>
<p>Si potrebbe anche concludere da questo grafico che vincere Premi Nobel spinge gli abitanti del Paese vincitore a consumare più cioccolato (conclusione insensata quanto la prima).</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" style="" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" style="--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0640.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="42" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" style="--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="correlazione--causazione-1">Correlazione != Causazione</h3>
<p><strong>Quando due variabili sono correlate, ciò non significa necessariamente che un cambiamento in una variabile causi il cambiamento nell'altra</strong>. Nel caso del cioccolato e dei Premi Nobel, è in gioco una terza variabile che guida entrambe le variabili mostrate nel grafico: lo sviluppo economico.</p>
<p>Questo ha senso: quando i Paesi diventano più ricchi, i loro abitanti hanno più mezzi finanziari per acquistare beni di lusso (come il cioccolato), e i loro governi hanno più risorse da investire nell'istruzione, il che a lungo termine può portare a vincere più Premi Nobel.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" style="" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-footer="Piantadosi, S., Byar, D. P., &amp; Green, S. B. (1988). The ecological fallacy. American journal of epidemiology, 127(5), 893-904. https://scientificintegrityinstitute.com/wp-content/uploads/2023/03/AJE050188.pdf" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" style="--footer:Piantadosi, S., Byar, D. P., &amp; Green, S. B. (1988). The ecological fallacy. American journal of epidemiology, 127(5), 893-904. https://scientificintegrityinstitute.com/wp-content/uploads/2023/03/AJE050188.pdf;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0639.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="43" data-footer="Piantadosi, S., Byar, D. P., &amp; Green, S. B. (1988). The ecological fallacy. American journal of epidemiology, 127(5), 893-904. https://scientificintegrityinstitute.com/wp-content/uploads/2023/03/AJE050188.pdf" data-theme="fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj" lang="en-GB" style="--footer:Piantadosi, S., Byar, D. P., &amp; Green, S. B. (1988). The ecological fallacy. American journal of epidemiology, 127(5), 893-904. https://scientificintegrityinstitute.com/wp-content/uploads/2023/03/AJE050188.pdf;--theme:fn9x5t53cis13u5kthd8qzj76kp2hoyyat7bnurphkj;--marpit-advanced-background-split:50%;" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="la-fallacia-ecologica">La fallacia ecologica</h3>
<p>Abbiamo anche ignorato il fatto che i dati mostrati sul grafico sono valori medi.</p>
<p>Può darsi che le persone che vincono i Premi Nobel mangino pochissimo cioccolato, e che il maggiore consumo di cioccolato delle altre persone nel Paese compensi il basso consumo dei vincitori del Nobel.</p>
<p>Fare un'affermazione a livello individuale basandosi sulle medie di un intero gruppo di persone è chiamata <em>fallacia ecologica</em>.</p>
<footer>Piantadosi, S., Byar, D. P., &amp; Green, S. B. (1988). The ecological fallacy. American journal of epidemiology, 127(5), 893-904. <a href="https://scientificintegrityinstitute.com/wp-content/uploads/2023/03/AJE050188.pdf">https://scientificintegrityinstitute.com/wp-content/uploads/2023/03/AJE050188.pdf</a></footer>
</section>

<h3 id="effetto-di-un-campione-troppo-piccolo">Effetto di un campione troppo piccolo</h3>
<p>Sulla base di questo grafico, possiamo concludere che il Liechtenstein è un posto pericoloso in cui vivere, dato che nel 2018 occupava il terzo posto nella classifica dei Paesi europei con il tasso di omicidi più alto.</p>
<p>Ma, per interpretare questi dati correttamente, dobbiamo considerare il campione: qui il tasso di omicidi è calcolato come numero di omicidi per 100.000 abitanti, ma nel 2018 il  Liechtenstein era abitato da sole 38.378 persone. Un tasso del 2,62 rappresenta solo un omicidio.</p>
</section>

<h3 id="attenzione-alle-proporzioni">Attenzione alle proporzioni</h3>
<p>Nel primo grafico, le proporzioni sono completamente sfasate: vengono mostrate  33 persone, di cui 8 che hanno sviluppato dei trombi dopo aver assunto il vaccino di AstraZeneca. Il grafico suggerisce che sia successo a quasi un quarto delle persone vaccinate, quando in realtà è solo lo 0,00005%.</p>
<p>Nel secondo, le proporzioni sono distorte dal layout. Un layout troppo ampio tenderà ad appiattire i trend nelle serie temporali. Un layout alto, con un rapporto larghezza-altezza basso, farà l'opposto e tenderà a sottolineare o persino drammatizzare i trend nei dati.</p>
</section>

<h3 id="attenzione-ai-colori">Attenzione ai colori</h3>
<p>Il primo e più semplice errore in cui cadere quando si parla di colori è quello di usare semplicemente i colori predefiniti dello strumento  utilizzato per creare la visualizzazione.</p>
<p>Lo strumento utilizzatoo non conosce il messaggio che si sta cercando di comunicare con la visualizzazione, né capisce i dati.</p>
<p>Il secondo grafico non è altro che il primo (composto da linee rosse, verdi e marroni) visto attraverso gli occhi di una persona con daltonismo: tutto diventa indistinguibile.</p>
</section>

<h3 id="attenzione-alle-caratteristiche-dei-grafici">Attenzione alle caratteristiche dei grafici</h3>
<p>La cattiva fama dei grafici a torta è in parte dovuta alla facilità con cui è possibile progettarli male.</p>
<p>I grafici a torta sono usati per mostrare come un totale è composto dalle sue parti. Quindi, le parti della torta dovrebbero sempre ammontare al 100%.</p>
<p>Questo, in generale, non è un problema, ma inizia a diventare complesso leggere un grafico a torta con molteplici fette. In particolare, i grafici a torta con più di <strong>5 fette</strong> diventano più difficili da leggere.</p>
</section>
