<h3 id="il-caso-cambridge-analytica">Il caso <em>Cambridge Analytica</em></h3>
<p>Nel 2007 viene creata un'applicazione Facebook chiamata MyPersonality, che permette agli utenti di compilare dei brevi questionari psicometrici.</p>
<p>Sulla base di questo, crea un piccolo profilo psicologico (basato sui Big Five).</p>
<p>Nell’ecosistema di Facebook, diventa possibile confrontare i risultati di questi test con tutti i tipi di altri dati online dei soggetti (likes, pagine seguite, informazioni di profilo, ecc.).</p>

<h3 id="il-caso-cambridge-analytica-1">Il caso <em>Cambridge Analytica</em></h3>
<p>Diventa molto semplice trovare delle correlazioni tra cose a cui hanno messo un “like”, cose che hanno condiviso o pubblicato, sesso, età, luogo di residenza, ecc. Ciò ha permesso ai ricercatori di fare correlazioni e trarre deduzioni molto affidabili.</p>
<p>Esempi: gli uomini a cui piace il marchio di cosmetici MAC tendono ad essere gay; gli uomini eterosessuali tendono a gradire i Wu-Tang Clan; i seguaci di Lady Gaga sono più estroversi, mentre gli amanti della filosofia sono più introversi.</p>

<h3 id="il-caso-cambridge-analytica-2">Il caso <em>Cambridge Analytica</em></h3>
<p>Ogni informazione di questo tipo è troppo debole per produrre una previsione affidabile su una persona, ma quando migliaia di singoli dati vengono combinati, le previsioni diventano molto più accurate.</p>

<h3 id="cos%C3%A8-lintelligenza-artificiale">Cos'è l'Intelligenza Artificiale?</h3>
<p>L'<strong>Intelligenza Artificiale</strong> (IA) è la scienza che studia tecniche computazionali in grado di emulare l’intelligenza umana. Si tratta anche dell'’abilità di una macchina di mostrare capacità umane quali il ragionamento, l’apprendimento, la pianificazione e la creatività.</p>
<p>L'IA permette a sistemi informatici di comprendere il proprio ambiente, mettersi in relazione con esso e risolvere problemi, agendo verso un obiettivo specifico, adattando il proprio comportamento.</p>

<h3 id="applicazioni-dellia">Applicazioni dell’IA</h3>
<p>Il campo d’applicazione dell'IA è diviso in un vastissimo insieme di aree specializzate, per ciascuna delle quali esistono sistemi molto efficienti nel compiere una azione, ma totalmente inadatti a compierne altre.</p>
<p>Si tratta di una delle principali differenze rispetto all’intelligenza umana, che per definizione è in grado di adattarsi a diversi tipi di problemi.</p>

<h3 id="applicazioni-dellia-1">Applicazioni dell’IA</h3>
<p>Ad esempio, i programmi di <em>machine translation</em> (traduzione automatica di testi) spesso raggiungono risultati pari o migliori degli umani nella traduzione di un altissimo numero di lingue.</p>
<p>Tuttavia, non riescono a tradurre il senso di espressioni idiomatiche o astratte (umorismo, metafore), a meno che non siano espressamente pre-programmate per affrontare quel tipo di costrutti in quel determinato linguaggio.</p>

<h3 id="la-nascita-dellia-1943-1955">La nascita dell’IA (1943-1955)</h3>
<p>Il primo lavoro che ora è generalmente riconosciuto come IA fu svolto da <strong>Warren McColluch</strong> e <strong>Walter Pitts</strong> (1943).</p>
<p>Si basarono su tre teorie:</p>
<ul>
<li data-marpit-fragment="1">
<p>La conoscenza sulla funzione dei <strong>neuroni</strong> nel cervello umano;</p>
</li>
<li data-marpit-fragment="2">
<p>L'analisi formale della <strong>logica proposizionale</strong>;</p>
</li>
<li data-marpit-fragment="3">
<p>La <strong>teoria della computazione di Turing</strong>.</p>
</li>
</ul>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="i-neuroni">I neuroni</h3>
<p>Il cervello elabora le informazioni attraverso i <strong>neuroni</strong>, cellule specializzate interconnesse tramite sinapsi.</p>
<p>I neuroni comunicano scambiandosi neurotrasmettitori, ovvero segnali elettrici e chimici.</p>
<p>Funzionano con un meccanismo a soglia: un neurone si &quot;attiva&quot; (generando un potenziale d'azione) solo se la somma degli stimoli eccitatori ricevuti supera un livello critico.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>

<h3 id="la-logica-proposizionale">La logica proposizionale</h3>
<p>È una branca della logica matematica che studia le <strong>proposizioni</strong>, ovvero affermazioni che possono assumere solo due stati: <em>vero</em> o <em>falso</em>.</p>
<p>Combina queste affermazioni utilizzando <strong>operatori logici</strong> (come <code>AND</code>, <code>OR</code>, <code>NOT</code>).</p>
<p>Permette di calcolare il valore di verità di espressioni e ragionamenti complessi in modo meccanico, rigoroso e privo di ambiguità testuali.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="la-teoria-della-computazione">La teoria della computazione</h3>
<p>Definisce i fondamenti matematici del calcolo, stabilendo quali problemi sono risolvibili  algoritmicamente e quali no.</p>
<p>Introduce la <strong>Macchina di Turing</strong>, un modello teorico astratto dotato di un nastro infinito su cui vengono letti e scritti simboli in base a un set di regole finite.</p>
<p>Dimostra che qualsiasi calcolo o procedura logica ben definita può essere eseguita da una singola macchina universale.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="la-nascita-dellia-1943-1955-1">La nascita dell’IA (1943-1955)</h3>
<p>Proposero un modello di neuroni artificiali in cui ogni neurone è caratterizzato come &quot;acceso&quot; o &quot;spento&quot;, con un passaggio a &quot;acceso&quot; che avviene in risposta alla stimolazione di un numero sufficiente di neuroni adiacenti.</p>
<p>Dimostrarono così che una rete neurale poteva rappresentare e calcolare qualsiasi espressione logica.</p>
<p>Provarono inoltre che la loro rete di neuroni artificiali era <em>Turing-completa</em>.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="entusiasmo-iniziale-grandi-aspettative-1952-1969">Entusiasmo iniziale, grandi aspettative (1952-1969)</h3>
<p>L’IA fu definita da <strong>John McCarthy</strong>, per la prima volta, nel 1956 come <em>la scienza e l’ingegneria di costruire macchine intelligenti</em>.</p>
<p>Più o meno nello stesso periodo, <strong>Alan Turing</strong>, nel suo articolo <em>Computing Machinery and Intelligence</em>(1950), proponeva un test per capire se un computer fosse in grado di emulare così bene il comportamento umano da diventare indistinguibile da una persona.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="il-test-di-turing">Il test di Turing</h3>
<p>Il test si suddivide in due fasi diverse. Nella prima fase partecipano tre persone: un uomo, una donna e un intervistatore. Le tre persone si trovano in stanze separate e comunicano tra loro tramite una telescrivente.</p>
<p>L'intervistatore formula delle domande scritte alle altre due persone. Non sa se si sta rivolgendo alla donna o all'uomo. Lo scopo delle domande è di capire il sesso delle altre due persone e capire quale sia l'uomo e quale sia una donna.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="il-test-di-turing-1">Il test di Turing</h3>
<ul>
<li data-marpit-fragment="1">Un partecipante è sincero, e ha l'obiettivo di agevolare l'identificazione da parte dell'intervistatore.</li>
<li data-marpit-fragment="2">Un partecipante mente, e ha l'obiettivo di far sbagliare l'identificazione da parte dell'intervistatore.</li>
</ul>
<p>L'intervistatore non sa chi mente e chi è sincero. Deve riuscire a capirlo da sé.</p>
<p>Ripetendo il gioco N volte, l'intervistatore sbaglia il sesso dei partecipanti per X volte. Il suo tasso di errore è pari a <code>X/N</code>.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

ner="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0916.png&quot;);background-size:contain;"><figcaption>&quot;https://it.wikipedia.org/wiki/Test_di_Turing&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="19" data-paginate="true" data-footer="Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. https://doi.org/10.1177/0008125619864925" data-theme="5qism3b2xavgej8go62xtosplyyxgp7rqvjo03t1qewo" lang="en-GB" data-marpit-pagination="19" style="--paginate:true;--footer:Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. https://doi.org/10.1177/0008125619864925;--theme:5qism3b2xavgej8go62xtosplyyxgp7rqvjo03t1qewo;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="il-test-di-turing-2">Il test di Turing</h3>
<p>Nella seconda fase del test  uno dei due partecipanti viene sostituito con un computer. Il processo è sempre lo stesso.</p>
<p>Il gioco si ripete N volte e l'intervistatore sbaglia l'identificazione dei partecipanti per Z volte, ottenendo un tasso di errore percentuale pari a <code>Z/N</code>.</p>
<p>Se la percentuale di errore nella seconda fase è simile o inferiore a quella della prima fase, allora il Test di Turing viene superato: la macchina è intelligente.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="una-dose-di-realt%C3%A0-1966-1973">Una dose di realtà (1966-1973)</h3>
<p>I primi sistemi di AI si rivelarono un fallimento quando furono messi alla prova su una gamma più ampia di problemi più difficili. Il primo tipo di difficoltà emerse perché la maggior parte dei primi programmi funzionava solo seguendo un insieme di istruzioni fisse per arrivare a una conclusione.</p>
<p>Un esempio famoso è ELIZA, un <em>chatbot</em> che simulava uno psicoterapeuta basandosi su un sistema di <em>pattern matching</em>.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="una-dose-di-realt%C3%A0-1966-1973-1">Una dose di realtà (1966-1973)</h3>
<p>Il secondo tipo di difficoltà fu l'irrisolvibilità di alcuni  problemi, come il <strong>problema del commesso viaggiatore</strong>.</p>
<p><em>Dato un certo numero di posizioni, qual è il percorso più corto che permette di visitarle tutte una e una sola volta?</em></p>
<p>Con l'esempio delle 15 città tedesche, esistono 43 589 145 600 soluzioni.</p>
<p>Problema di ottimizzazione discreta per cui potrebbe non esistere una soluzione esatta e utile.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="una-dose-di-realt%C3%A0-1966-1973-2">Una dose di realtà (1966-1973)</h3>
<p>Quindi, questi primi metodi di risoluzione dei problemi erano meccanismi che cercavano di mettere insieme passaggi elementari di ragionamento per trovare soluzioni complete.</p>
<p>Tali approcci sono stati chiamati <strong>deboli</strong> perché, sebbene generali, non erano in grado di scalare per affrontare istanze di problemi più grandi o difficili.</p>
<p>Ciononostante, furono fondamentali per passare alle tecnologie successive.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="sistemi-basati-sulla-conoscenza-1969-1979">Sistemi basati sulla conoscenza (1969-1979)</h3>
<p>L’alternativa ai metodi deboli è stata quella di utilizzare conoscenze più potenti e specifiche per il dominio specifico relativo al problema da affrontare.</p>
<p>Questi metodi utilizzavano passaggi di ragionamento più ampi per gestire più facilmente i casi tipicamente ricorrenti in aree di competenza ristrette.</p>
<p>Questi tipi di sistemi erano anche chiamati <strong>sistemi esperti</strong>.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>

<h3 id="sistemi-basati-sulla-conoscenza-1969-1979-1">Sistemi basati sulla conoscenza (1969-1979)</h3>
<p>La base di un qualsiasi sistema esperto consiste in due elementi principali:</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>Base di conoscenza</strong>: una grande raccolta di informazioni su un certo argomento (ad esempio, malattie e trattamenti per un sistema medico);</p>
</li>
<li data-marpit-fragment="2">
<p><strong>Motore di inferenza</strong>: il cervello del sistema, che usa la base di conoscenza per fare ragionamenti e trovare soluzioni.</p>
</li>
</ul>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="inverno-della-ia-1980-1993">Inverno della IA (1980-1993)</h3>
<p>L’industria dell’IA esplose da pochi milioni di dollari nel 1980 a miliardi di dollari nel 1988, includendo centinaia di aziende che costruivano sistemi esperti, robot e software e hardware specializzati per questi scopi.</p>
<p>Poco dopo, arrivò un periodo di “inverno dell’IA”, in cui molte aziende fallirono, poiché non riuscirono a mantenere le promesse fatte per via della <strong>dipendenza da regole fisse</strong> e dell'<strong>impossibilità di aggiornare autonomamente la conoscenza</strong>.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="reti-neurali-e-apprendimento-automatico-1986-presente">Reti neurali e apprendimento automatico (1986-presente)</h3>
<p>Questi metodi hanno la capacità di apprendere dall’esperienza. Possono confrontare il valore di output previsto con il valore reale rispetto ad un problema e modificare i loro parametri per ridurre la differenza (e quindi l’errore).</p>
<p>La fragilità dei sistemi esperti portò a un nuovo approccio che incorporava la <strong>probabilità</strong> anziché l’inferenza, e l’<strong>apprendimento automatico</strong> anziché la creazione di basi di conoscenza.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>

<h3 id="big-data-2001-presente">Big data (2001-presente)</h3>
<p>Nel corso della storia di 60 anni dell’informatica, l’enfasi è sempre stata sull’algoritmo come principale oggetto di studio. Alcuni lavori recenti nell’IA suggeriscono che, per molti problemi, ha più senso preoccuparsi dei dati e essere meno selettivi riguardo all’algoritmo da applicare.</p>
<p>Questo è particolarmente vero considerando l'emergenza di dataset giganteschi ed estremamente complessi, i cosiddetti <em>big data</em>.</p>

<h3 id="big-data-2001-presente-1">Big data (2001-presente)</h3>
<p>Dato l’uso della parola <em>plant</em> in una frase, a cosa ci si riferisce?</p>
<p>Gli approcci fino ad ora si basavano su esempi etichettati dall’uomo combinati con algoritmi di IA.</p>
<p><strong>Yarowsky</strong> mostrò che questa attività poteva essere svolta senza esempi, con una precisione del 96%, analizzando un corpus di testi molto grande con le definizioni del dizionario dei due sensi (cioè <em>plant: pianta</em> e <em>plant: impianto industriale</em>).</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>

<h3 id="deep-learning-2011%E2%80%93presente">Deep learning (2011–presente)</h3>
<p>Il <em>deep learning</em> si riferisce all'apprendimento automatico che utilizza più livelli di elementi computazionali semplici e regolabili.</p>
<p>Esperimenti con tali reti furono condotti già negli anni '70 e '90. Tuttavia, fu solo nel 2011 che i metodi di <em>deep learning</em> decollarono veramente.</p>
<p>Questo avvenne inizialmente nel riconoscimento vocale e poi nel riconoscimento visivo di oggetti.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="deep-learning-2011%E2%80%93presente-1">Deep learning (2011–presente)</h3>
<p>Nel 2012, in una competizione per classificare le immagini in una delle mille categorie (armadillo, libreria, cavatappi, ecc.), un sistema di deep learning creato da <strong>Geoffrey Hinton</strong> dimostrò un miglioramento drammatico rispetto ai sistemi precedenti, che si basavano in gran parte su <em>features</em> estratte a mano.</p>
<p>Il deep learning dipende da <strong>hardware molto potente</strong> e dalla <strong>disponibilità di grandi quantità di dati</strong> di addestramento.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

<h3 id="large-language-models-2017-presente">Large Language Models (2017-presente)</h3>
<p>L'evoluzione più recente del Deep Learning è rappresentata dall'IA <strong>generativa</strong> e dai <em><strong>Large Language Models</strong></em> (LLM).</p>
<p>A differenza dei modelli precedenti (addestrati per classificare dati), questi modelli sono addestrati per <strong>creare</strong> dati.</p>
<p>La svolta avviene nel 2017 con l'introduzione dell'architettura <strong>Transformer</strong>.</p>
<footer>Haenlein, M., &amp; Kaplan, A. (2019). A brief history of artificial intelligence: On the past, present, and future of artificial intelligence. California management review, 61(4), 5-14. <a href="https://doi.org/10.1177/0008125619864925">https://doi.org/10.1177/0008125619864925</a></footer>
</section>

vgej8go62xtosplyyxgp7rqvjo03t1qewo;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="large-language-models-2017-presente-1">Large Language Models (2017-presente)</h3>
<p>L'architettura Transformer permette alle reti neurali di elaborare intere frasi analizzando il contesto e le relazioni tra tutte le parole contemporaneamente. L'unione tra Transformer, potenze di calcolo evolute e l'utilizzo di enormi quantità di testo ha permesso di creare modelli con centinaia di miliardi di parametri.</p>
<p>Il rilascio di <strong>ChatGPT</strong> a fine 2022 segna un punto di svolta storico: un'IA che supera ampiamente il test di Turing (l'IA generativa) diventa accessibile al grande pubblico.</p>
</section>
