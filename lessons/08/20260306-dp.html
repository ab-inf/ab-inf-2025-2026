<h3 id="lombra-digitale">L'ombra digitale</h3>
<p>Quando è stata l'ultima volta che avete cercato il vostro nome online?</p>
<p>Questo è il primo passo da fare se volete scoprire di più sulla vostra ombra digitale, che è molto probabilmente più estesa di quanto immaginate.</p>
<p>Non potete usare  dispositivi connessi a Internet senza lasciare traccia.</p>
<p>C'è però sempre qualcosa che potete fare per gestire, limitare e proteggere la vostra presenza online.</p>
<footer>Micheli, M., Lutz, C., &amp; Büchi, M. (2018). Digital footprints: an emerging dimension of digital inequality. Journal of Information, Communication and Ethics in Society, 16(3), 242-251. <a href="https://doi.org/10.1108/JICES-02-2018-0014">https://doi.org/10.1108/JICES-02-2018-0014</a></footer>
</section>

<h3 id="lombra-digitale-1">L'ombra digitale</h3>
<p>L'<strong>ombra digitale</strong> è <em>l'insieme tracciabile di dati generati da attività ed eventi manifestati da un utente in rete attraverso l'utilizzo di tecnologie digitali</em>.</p>
<p>Un'ombra digitale consiste quindi in tutto ciò che create mentre siete sul Web per qualsiasi tipo di attività che può essere ricondotta alla vostra identità.</p>
<p>Questo concetto include anche tutto ciò che concerne la percezione che le vostre azioni creano sul Web.</p>
<footer>Micheli, M., Lutz, C., &amp; Büchi, M. (2018). Digital footprints: an emerging dimension of digital inequality. Journal of Information, Communication and Ethics in Society, 16(3), 242-251. <a href="https://doi.org/10.1108/JICES-02-2018-0014">https://doi.org/10.1108/JICES-02-2018-0014</a></footer>
</section>

<h3 id="lombra-digitale-passiva">L'ombra digitale passiva</h3>
<p>Tutto ciò che tocchiamo sul Web fa parte della nostra <strong>ombra digitale passiva</strong>, ovvero <em>i (meta)dati che disseminiamo non intenzionalmente sul Web</em>.</p>
<p>Si tratta di una combinazione di dati riguardanti i dispositivi che utilizziamo sul Web e le azioni che conduciamo.</p>
<ul>
<li data-marpit-fragment="1">Indirizzo IP;</li>
<li data-marpit-fragment="2">Informazioni sul dispositivo che stiamo utilizzando;</li>
<li data-marpit-fragment="3">La cronologia dei siti.</li>
</ul>
<footer>Micheli, M., Lutz, C., &amp; Büchi, M. (2018). Digital footprints: an emerging dimension of digital inequality. Journal of Information, Communication and Ethics in Society, 16(3), 242-251. <a href="https://doi.org/10.1108/JICES-02-2018-0014">https://doi.org/10.1108/JICES-02-2018-0014</a></footer>
</section>

<h3 id="lombra-digitale-passiva-1">L'ombra digitale passiva</h3>
<ul>
<li data-marpit-fragment="1">Le azioni condotte su questi siti (quante volte abbiamo visitato un sito, le pagine su cui abbiamo speso più tempo, link e bottoni cu sui abbiamo cliccato);</li>
<li data-marpit-fragment="2">Il browser che stiamo utilizzando;</li>
<li data-marpit-fragment="3">Le nostre ricerche;</li>
<li data-marpit-fragment="4">I nostri acquisti.</li>
</ul>
<p>Per esempio, è possibile utilizzare il nostro indirizzo IP per mostrare automaticamente contenuti nella nostra lingua.</p>
<footer>Micheli, M., Lutz, C., &amp; Büchi, M. (2018). Digital footprints: an emerging dimension of digital inequality. Journal of Information, Communication and Ethics in Society, 16(3), 242-251. <a href="https://doi.org/10.1108/JICES-02-2018-0014">https://doi.org/10.1108/JICES-02-2018-0014</a></footer>

<h3 id="lombra-digitale-attiva">L'ombra digitale attiva</h3>
<p>Oltre ai (meta)dati prodotti passivamente, c'è anche l'<strong>ombra digitale attiva</strong>, ovvero <em>l'insieme di (meta)dati che decidiamo di condividere volutamente sul Web</em>.</p>
<p>Ogni email che mandiamo, ogni form che compiliamo, ogni media che carichiamo entra a far parte dei dati personali che esponiamo volutamente sul Web.</p>
<p>Questi dati si accumulano nel tempo, permettendo la ricosruzione accurata della nostra identità.</p>

<h3 id="lombra-digitale-attiva-1">L'ombra digitale attiva</h3>
<ul>
<li data-marpit-fragment="1">Indirizzo email, indirizzo, numero di telefono, dettagli della carta di credito, cronologia di ricerca di prodotti, ...</li>
<li data-marpit-fragment="2">Post, foto, video, messaggi, file, contatti telefonici, contenuti preferiti, ...</li>
<li data-marpit-fragment="3">Codice fiscale, cartella medica, dati bancari, fedina penale, dati fiscali, dati previdenziali, impronte digitali, età, etnia, ...</li>
<li data-marpit-fragment="4">Dati di geolocalizzazione, app utilizzate, chiamate, password, note...</li>
<li data-marpit-fragment="5">Tutti questi dati, ma dei contatti...</li>
</ul>

<h3 id="perch%C3%A9-ci-deve-interessare">Perché ci deve interessare?</h3>
<p>Incrociando questi dati, la profilazione diventa un'attività triviale. L'ombra digitale, dopotutto, è un riflesso piuttosto accurato delle nostre caratteristiche e pensieri.</p>
<p>La profilazione permette una serie di azioni progettate per influenzare la nostra vita in un'infinità di modi diversi (es., cyber-criminali, <em>ad</em> personalizzati, ...).</p>
<p>Una volta che un dato è online, diventa estremamente difficile - se non impossibile - rimuoverlo definitivamente.</p>
<footer>Micheli, M., Lutz, C., &amp; Büchi, M. (2018). Digital footprints: an emerging dimension of digital inequality. Journal of Information, Communication and Ethics in Society, 16(3), 242-251. <a href="https://doi.org/10.1108/JICES-02-2018-0014">https://doi.org/10.1108/JICES-02-2018-0014</a></footer>
</section>

<h3 id="quali-sono-i-rischi">Quali sono i rischi?</h3>
<p>I potenziali datori di lavoro esaminano la nostra impronta digitale per individuare segnali negativi che potrebbero renderci inadatti al lavoro.</p>
<ul>
<li data-marpit-fragment="1">Foto e video compromettenti;</li>
<li data-marpit-fragment="2">Contenuti sensibili o inopportuni;</li>
<li data-marpit-fragment="3">Lamentele verso i precedenti datori di lavoro;</li>
<li data-marpit-fragment="4">Uso di volgarità nei post;</li>
<li data-marpit-fragment="5">Segnali di pregiudizio o comportamenti aggressivi.</li>
</ul>
<footer>Micheli, M., Lutz, C., &amp; Büchi, M. (2018). Digital footprints: an emerging dimension of digital inequality. Journal of Information, Communication and Ethics in Society, 16(3), 242-251. <a href="https://doi.org/10.1108/JICES-02-2018-0014">https://doi.org/10.1108/JICES-02-2018-0014</a></footer>
</section>

<h3 id="quali-sono-gli-impatti">Quali sono gli impatti?</h3>
<p>Le ombre digitali delle categorie vulnerabili come bambini e anziani sono particolarmente esposte.</p>
<p>Prima di acquistare un nuovo dispositivo o servizio, valuta come contribuisca alla tua e alla loro impronta digitale.</p>
<p>Ad esempio, i dispositivi IoT aumentano esponenzialmente il volume di dati associati alla tua identità online (es. temperatura corporea, battito cardiaco, ritmi del sonno, abitudini di igiene orale).</p>
<footer>Micheli, M., Lutz, C., &amp; Büchi, M. (2018). Digital footprints: an emerging dimension of digital inequality. Journal of Information, Communication and Ethics in Society, 16(3), 242-251. <a href="https://doi.org/10.1108/JICES-02-2018-0014">https://doi.org/10.1108/JICES-02-2018-0014</a></footer>

<h3 id="quali-sono-gli-impatti-1">Quali sono gli impatti?</h3>
<p>È molto difficile cogliere il collegamento tra la tua traccia digitale e il modo in cui altri la usano per i propri interessi, come i suggerimenti di articoli o la pubblicità personalizzata basata sulle tue ricerche precedenti.</p>
<ul>
<li data-marpit-fragment="1">Aziende private;</li>
<li data-marpit-fragment="2">Governi;</li>
<li data-marpit-fragment="3">Organizzazioni politiche;</li>
<li data-marpit-fragment="4">Data broker;</li>
<li data-marpit-fragment="5">Criminali informatici.</li>
</ul>

<h3 id="quanto-ci-dobbiamo-preoccupare">Quanto ci dobbiamo preoccupare?</h3>
<p>Quanto ci sentiamo a nostro agio con ciò che le nostre ombre digitali dicono di noi?</p>
<p>Prendiamo come esempio una foto.</p>
<p>Abbiamo già detto che quando creiamo un'immagine digitale, creiamo anche una serie di metadati interni a quell'immagine che la descrivono, come il luogo in cui l'immagine è stata creata, il dispositivo, la data.</p>

</section>

<h3 id="quanto-ci-dobbiamo-preoccupare-1">Quanto ci dobbiamo preoccupare?</h3>
<p>Questi metadati esistono per validi motivi (es., organizzazione, post-produzione, ecc.). Tuttavia, quando questi iniziano ad esistere sul Web, diventano un rischio per la privacy.</p>
<p>Esistono casi documentati di giornalisti localizzati tramite i metadati delle foto, di persone perseguitate tramite le coordinate GPS incorporate nelle immagini, e così via.</p>

<h3 id="quanto-ci-dobbiamo-preoccupare-2">Quanto ci dobbiamo preoccupare?</h3>
<p>L'<strong><em>Exchangeable Image File Format</em></strong> (EXIF) è uno dei principali schemi di metadati per le immagini.</p>
<p>I metadati EXIF vengono creati da fotocamere e smartphone al momento dello scatto, e includono le impostazioni della fotocamera, il modello del dispositivo, le coordinate GPS, la data e l'ora, l'orientamento e altro ancora.</p>
<p>Esempio: <a href="https://jimpl.com/">https://jimpl.com/</a>.</p>
<footer>Micheli, M., Lutz, C., &amp; Büchi, M. (2018). Digital footprints: an emerging dimension of digital inequality. Journal of Information, Communication and Ethics in Society, 16(3), 242-251. <a href="https://doi.org/10.1108/JICES-02-2018-0014">https://doi.org/10.1108/JICES-02-2018-0014</a></footer>
</section>

<h3 id="quanto-ci-dobbiamo-preoccupare-3">Quanto ci dobbiamo preoccupare?</h3>
<p><strong>Tracciamento tramite coordinate GPS</strong>: quando i servizi di localizzazione dello smartphone sono attivi (di default su quasi tutti i dispositivi), ogni foto viene contrassegnata con precise coordinate GPS. In pratica, una foto scattata a casa nostra rivela il nostro indirizzo.</p>
<p>Le coordinate GPS sono salvate come semplici valori numerici, facilmente estraibili con strumenti gratuiti e incollabili su Google Maps.</p>
<footer>Micheli, M., Lutz, C., &amp; Büchi, M. (2018). Digital footprints: an emerging dimension of digital inequality. Journal of Information, Communication and Ethics in Society, 16(3), 242-251. <a href="https://doi.org/10.1108/JICES-02-2018-0014">https://doi.org/10.1108/JICES-02-2018-0014</a></footer>

<h3 id="quanto-ci-dobbiamo-preoccupare-4">Quanto ci dobbiamo preoccupare?</h3>
<p><strong><em>Fingerprinting</em> del dispositivo</strong>: ogni fotocamera e smartphone produce metadati su se stesso in ogni immagine prodotta (es., produttore, modello, obiettivo, versione, ecc.).</p>
<p>Di per sé il <em>fingerprinting</em> può sembrare innocuo, ma in combinazione con altri dati diventa un potente strumento di identificazione (es., collegamento di account anonimi, identificazione forense, spionaggio aziendale, ecc.).</p>
<footer>Micheli, M., Lutz, C., &amp; Büchi, M. (2018). Digital footprints: an emerging dimension of digital inequality. Journal of Information, Communication and Ethics in Society, 16(3), 242-251. <a href="https://doi.org/10.1108/JICES-02-2018-0014">https://doi.org/10.1108/JICES-02-2018-0014</a></footer>

<h3 id="il-caso-strava">Il caso Strava</h3>
<p>Nel 2017, l'app di <em>fitness tracking</em> Strava ha pubblicato una <a href="https://labs.strava.com/heatmap/#5.86/-6.65559/54.16622/hot/all">visualizzazione dei dati</a> raccolti tra il 2015 e il 2017, inclusi i percorsi di allenamento di personale militare americano all'interno di basi in giro per il mondo, come Siria e Afghanistan.</p>
<p>Strava usa il GPS del cellulare per tenere traccia dell'attività fisica, raccogliere dati e compararli con quelli di altri utenti. Parliamo di circa un miliardo di attività: circa tremila miliardi di punti dati che coprono 27 miliardi di km.</p>
<footer>Micheli, M., Lutz, C., &amp; Büchi, M. (2018). Digital footprints: an emerging dimension of digital inequality. Journal of Information, Communication and Ethics in Society, 16(3), 242-251. <a href="https://doi.org/10.1108/JICES-02-2018-0014">https://doi.org/10.1108/JICES-02-2018-0014</a></footer>
</section>

-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/0811.png&quot;);background-size:contain;"><figcaption>&quot;https://news.stanford.edu/stories/2017/08/pizza-privacy-stanford-economist-examines-paradox-digital-age&quot;</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="19" data-paginate="true" data-footer="Barth, S., &amp; De Jong, M. D. (2017). The privacy paradox–Investigating discrepancies between expressed privacy concerns and actual online behavior–A systematic literature review. Telematics and informatics, 34(7), 1038-1058. https://doi.org/10.1016/j.tele.2017.04.013" data-theme="jrx9ddwk4om0yliwujqo1skauj4dwje5k3ftovvc74" lang="en-GB" data-marpit-pagination="19" style="--paginate:true;--footer:Barth, S., &amp; De Jong, M. D. (2017). The privacy paradox–Investigating discrepancies between expressed privacy concerns and actual online behavior–A systematic literature review. Telematics and informatics, 34(7), 1038-1058. https://doi.org/10.1016/j.tele.2017.04.013;--theme:jrx9ddwk4om0yliwujqo1skauj4dwje5k3ftovvc74;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="45" data-transition-back="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;pivot&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="il-privacy-paradox">Il <em>Privacy paradox</em></h3>
<p>Il <strong>paradosso della privacy</strong> è <em>un'incoerenza tra gli atteggiamenti dichiarati verso la privacy e il comportamento delle persone</em>.</p>
<p>Sebbene gli studi indicano che le persone desiderano proteggere i propri dati personali, esse tendono a ignorare sistematicamente i termini di servizio o le informative sulla privacy.</p>
<p>La possibilità di NON essere tracciati o osservati è quasi un'illusione. Sistemi di sorveglianza esistenti a parte, molte tecnologie nascono per fornire un servizio, ma contemporaneamente riducono la privacy attraverso meccanismi di tracciamento (es. dispositivi indossabili).</p>
<footer>Barth, S., &amp; De Jong, M. D. (2017). The privacy paradox–Investigating discrepancies between expressed privacy concerns and actual online behavior–A systematic literature review. Telematics and informatics, 34(7), 1038-1058. <a href="https://doi.org/10.1016/j.tele.2017.04.013">https://doi.org/10.1016/j.tele.2017.04.013</a></footer>
</section>

<h3 id="il-privacy-paradox-1">Il <em>Privacy paradox</em></h3>
<p>Un contributo alla generale erosione della privacy è dato da tendenze come il significativo aumento del networking professionale e sociale online.</p>
<p>Sebbene le tecnologie digitali offrano più <em>affordance</em> che mai, uno dei rischi connessi a tali opportunità riguarda proprio la privacy.</p>
<p>Solo l'1% dei dati globali era digitalizzato nel 1986. Nel 2000: 25%. Entro il 2007: 97%. Oggi la maggior parte delle informazioni è digitale.</p>
<footer>Barth, S., &amp; De Jong, M. D. (2017). The privacy paradox–Investigating discrepancies between expressed privacy concerns and actual online behavior–A systematic literature review. Telematics and informatics, 34(7), 1038-1058. <a href="https://doi.org/10.1016/j.tele.2017.04.013">https://doi.org/10.1016/j.tele.2017.04.013</a></footer>
</section>

<h3 id="il-privacy-paradox-2">Il <em>Privacy paradox</em></h3>
<p>Secondo alcuni, il paradosso non esiste, poiché il concetto di autogestione della propria privacy è un'attività non scalabile, e di fatto impossibile da fare in modo esaustivo. Le persone non possono imparare abbastanza sui rischi per prendere decisioni informate in merito.</p>
<p>La tecnologia ha avuto un ruolo fondamentale nel progettare il consenso: il Web e Internet hanno facilitato la condivisione di informazioni <em>senza la percezione delle normali conseguenze di tale condivisione</em>.</p>
<footer>Solove, D. J. (2021). The myth of the privacy paradox. Geo. Wash. L. Rev., 89, 1. <a href="https://scholarship.law.gwu.edu/cgi/viewcontent.cgi?article=2738&amp;context=faculty_publications">https://scholarship.law.gwu.edu/cgi/viewcontent.cgi?article=2738&amp;context=faculty_publications</a></footer>

<h3 id="il-privacy-paradox-3">Il <em>Privacy paradox</em></h3>
<p>Se il paradosso esiste, come lo affrontiamo?</p>
<p>Alcuni potrebbero cercare approcci dall'alto (top-down) per proteggere la privacy digitale, sotto forma di politiche più forti o specifiche (leggi e normative); altri potrebbero cercare soluzioni dal basso (bottom-up) per educare il consumatore e incoraggiarlo a prestare attenzione per proteggere la propria privacy.</p>

<h3 id="il-privacy-paradox-4">Il <em>Privacy paradox</em></h3>
<p>In uno studio, degli adulti si sono iscritti a un social fittizio, e sono stati osservati nel loro approccio alle informative sulla privacy e ai Termini di Servizio.</p>
<p>Il 74% ha saltato l'informativa sulla privacy cliccando direttamente su &quot;accetta&quot;. Chi si è fermato a leggere l'informativa, vi ha dedicato in media 73 secondi. La maggior parte (97%) ha accettato l'informativa. Il 93% ha accettato i termini nonostante contenessero clausole tipo &quot;i tuoi dati saranno condivisi con l'NSA&quot; o &quot;dovrai rinunciare al tuo primogenito&quot;.</p>
<footer>Obar, J. A., &amp; Oeldorf-Hirsch, A. (2020). The biggest lie on the internet: Ignoring the privacy policies and terms of service policies of social networking services. Information, communication &amp; society, 23(1), 128-147.  <a href="https://doi.org/10.1080/1369118X.2018.1486870">https://doi.org/10.1080/1369118X.2018.1486870</a></footer>
</section>

<h3 id="in-europa-abbiamo-il-general-data-protection-regulation-gdpr">In Europa abbiamo il General Data Protection Regulation (GDPR)</h3>
<p>Il <strong>GDPR</strong> è <em>il Regolamento Generale Europeo sulla Protezione dei Dati Personali</em>, applicato a decorrere dal 25 maggio 2018 a livello europeo.</p>
<p>La necessità di definire una base comune per la protezione dei dati nasce dalla continua evoluzione degli stessi concetti di privacy e protezione dei dati personali, dovuta principalmente alla diffusione del progresso tecnologico.</p>
<footer>Li, H., Yu, L., &amp; He, W. (2019). The impact of GDPR on global technology development. Journal of Global Information Technology Management, 22(1), 1-6. <a href="https://doi.org/10.1080/1097198X.2019.1569186">https://doi.org/10.1080/1097198X.2019.1569186</a></footer>
</section>

<h3 id="cosa-sono-i-dati-personali">Cosa sono i dati personali?</h3>
<p>I <strong>dati personali</strong> sono <em>qualsiasi informazione riguardante una persona fisica identificata o identificabile, direttamente o indirettamente</em>.</p>
<p>Con questa dicitura ci riferiamo con particolare riferimento a un identificativo come il nome, un numero di identificazione, dati relativi all’ubicazione, un identificativo online o a uno o più elementi caratteristici della sua identità fisica, fisiologica genetica, psichica, economica, culturale o sociale.</p>
<footer>Li, H., Yu, L., &amp; He, W. (2019). The impact of GDPR on global technology development. Journal of Global Information Technology Management, 22(1), 1-6. <a href="https://doi.org/10.1080/1097198X.2019.1569186">https://doi.org/10.1080/1097198X.2019.1569186</a></footer>
</section>

<h3 id="cos%C3%A8-il-trattamento-di-un-dato">Cos’è il trattamento di un dato?</h3>
<p>Il <strong>trattamento di un dato</strong> è <em>una qualsiasi attività di gestione del dato, incluse la raccolta, conservazione, modifica, consultazione, comunicazione, cancellazione su qualsiasi supporto informatico, cartaceo o analogico, sia attraverso operatori sia con processi automatizzati</em>.</p>
<p>Ai sensi del GDPR, il trattamento dei dati deve essere <strong>lecito</strong>, <strong>trasparente</strong> e <strong>finalizzato</strong>.</p>
<footer>Li, H., Yu, L., &amp; He, W. (2019). The impact of GDPR on global technology development. Journal of Global Information Technology Management, 22(1), 1-6. <a href="https://doi.org/10.1080/1097198X.2019.1569186">https://doi.org/10.1080/1097198X.2019.1569186</a></footer>
</section>

<h3 id="principi-del-gdpr">Principi del GDPR</h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>Liceità e correttezza</strong>: necessità del consenso, protezione dell’interesse vitale, dell’interesse pubblico e dell’interesse legittimo;</p>
</li>
<li data-marpit-fragment="2">
<p><strong>Trasparenza</strong>: fornire informazioni sul trattamento facilmente accessibili e comprensibili;</p>
</li>
<li data-marpit-fragment="3">
<p><strong>Limitazione delle finalità dei trattamenti</strong>: identificazione necessaria delle finalità per le quali i dati saranno usati;</p>
</li>
</ul>
<footer>Li, H., Yu, L., &amp; He, W. (2019). The impact of GDPR on global technology development. Journal of Global Information Technology Management, 22(1), 1-6. <a href="https://doi.org/10.1080/1097198X.2019.1569186">https://doi.org/10.1080/1097198X.2019.1569186</a></footer>

<h3 id="principi-del-gdpr-1">Principi del GDPR</h3>
<ul>
<li data-marpit-fragment="1"><strong>Minimizzazione</strong>: limitazione della raccolta ai soli dati direttamente rilevanti e necessari per raggiungere uno scopo specifico;</li>
<li data-marpit-fragment="2"><strong>Esattezza</strong>: i dati devono essere corretti e aggiornati;</li>
<li data-marpit-fragment="3"><strong>Limitazione della conservazione</strong>: i dati devono essere conservati solo per il tempo necessario;</li>
<li data-marpit-fragment="4"><strong>Integrità e riservatezza</strong>: i dati devono essere trattati con tecniche di sicurezza per proteggerli da attacchi o danni accidentali.</li>
</ul>
<footer>Li, H., Yu, L., &amp; He, W. (2019). The impact of GDPR on global technology development. Journal of Global Information Technology Management, 22(1), 1-6. <a href="https://doi.org/10.1080/1097198X.2019.1569186">https://doi.org/10.1080/1097198X.2019.1569186</a></footer>
</section>

<h3 id="cosa-sono-i-cookie">Cosa sono i cookie?</h3>
<p>Immaginiamo di tornare su <a href="https://www.amazon.com">https://www.amazon.com</a> dopo esserci loggati settimane fa.</p>
<p>Una volta che la pagina si carica, siamo già automaticamente loggati.</p>
<p>Non abbiamo dovuto effettuare di nuovo il login, perché Amazon sapeva già che eravamo noi.</p>
<p>Questo è possibile grazie ai <em><strong>cookie</strong></em>.</p>

<h3 id="cosa-sono-i-cookie-1">Cosa sono i cookie?</h3>
<p>I <em><strong>cookie</strong></em> sono piccoli file di testo mandati da un server, trattenuti dal browser e memorizzati sul dispositivo.</p>
<p>Ad ogni richiesta allo stesso server, i cookie vengono rimandati indietro dal browser sotto forma di informazioni contenute negli <em>header</em> della richiesta.</p>
<p>I cookie sono progettati per tenere traccia delle informazioni riguardanti l’utente.</p>
<p>I siti ci “fiutano” seguendo la traccia lasciata dai cookie.</p>
<footer>Cahn, A., Alfeld, S., Barford, P., &amp; Muthukrishnan, S. (2016, April). An empirical study of web cookies. In Proceedings of the 25th international conference on world wide web (pp. 891-901). <a href="https://doi.org/10.1145/2872427.2882991">https://doi.org/10.1145/2872427.2882991</a></footer>
</section>

<h3 id="alcune-tipologie-di-cookie">Alcune tipologie di cookie</h3>
<p><strong>Tecnici</strong>: essenziali per l’interazione con un sito Web (es. cookie di sessione che mantengono l’accesso dell’utente al sito).</p>
<p><strong>Analitici</strong>: raccolgono informazioni sull’utilizzo del sito Web da parte dell’utente (e.g. cookie di Google Analytics).</p>
<p><strong>Profilazione</strong>: raccolgono informazioni sull’utente per profilarlo ed inviargli pubblicità mirata (e.g. cookie di Google AdSense).</p>

<h3 id="come-funzionano-i-cookie">Come funzionano i cookie?</h3>
<p>Utilizziamo la metafora della <strong>visita medica</strong>. Immaginiamo di andare dal medico.</p>
<p>Un assistente verifica la nostra identità e ci manda in una stanza. Quando il medico arriva, ha già una copia della nostra storia clinica.</p>
<p>Nel nostro esempio, il medico è il sito Web, che interagisce con molti pazienti (browser) e deve essere in grado di reagire rapidamente per rispondere ad ognuno di loro.</p>

<h3 id="come-funzionano-i-cookie-1">Come funzionano i cookie?</h3>
<p>L'assistente è come il server, in quanto &quot;prepara il medico&quot; dandogli informazioni sul prossimo paziente in anticipo. Noi siamo il browser.</p>
<p>Ora immaginiamo che quella comunicazione iniziale tra noi e l’assistente non sia mai avvenuta.</p>
<p>Siamo semplicemente entrati nell’ambulatorio e siamo passati direttamente a raccontare la nostra storia clinica.</p>

</section>

<h3 id="come-funzionano-i-cookie-2">Come funzionano i cookie?</h3>
<p>Per noi sarebbe molto difficile per almeno due motivi: faremmo moltissima fatica a ricordare tutto, o comunque in una maniera che sia utile per il medico, e ci metteremmo troppo tempo.</p>
<p>Invece, è necessario un meccanismo che fornisca rapidamente le informazioni necessarie al medico.</p>
<p>Tecnicamente, è per questo che abbiamo bisogno dei cookie.</p>

<h3 id="come-funzionano-i-cookie-3">Come funzionano i cookie?</h3>
<p>Quindi, un cookie è un breve pezzo di testo che viene memorizzato nel browser del visitatore del sito Web. Potrebbe contenere un ID utente che permetterà al sito di farci accedere immediatamente. Abbiamo ricevuto quell’ID quando abbiamo creato l’account per la prima volta.</p>
<p>Quell’ID viene poi inviato dal server al client al momento del login e da quest’ultimo memorizzato (fino a quando - o a meno che - non abbiamo intrapreso determinate azioni).</p>

<h3 id="come-funzionano-i-cookie-4">Come funzionano i cookie?</h3>
<p>Entriamo in ambulatorio e ci registriamo dall'assistente, che ci chiede l'ID. Il medico arriva con la nostra storia clinica. Possiamo interagire facilmente con il medico e arrivare al nostro obiettivo.</p>
<p>Inviamo una richiesta HTTP al server. Nella richiesta c'è un cookie che il server stesso ci ha mandato in precedenza. Il server legge il nostro cookie e risponde con un messaggio HTTP positivo. Possiamo interagire con il sito e raggiungere il nostro obiettivo.</p>
<footer>Kononenko, K. (2018). Internet Cookies Explained by Taking Your Kids To The Doctor’s Office. On CodeAnalogies Blog. <a href="https://blog.codeanalogies.com/2018/06/02/internet-cookies-explained-by-taking-your-kids-to-the-doctors-office/">https://blog.codeanalogies.com/2018/06/02/internet-cookies-explained-by-taking-your-kids-to-the-doctors-office/</a></footer>
</section>

<h3 id="in-teoria-i-cookie-non-sono-condivisi-tra-i-siti-che-visitate">In teoria, i cookie non sono condivisi tra i siti che visitate</h3>
<p>In teoria, non esiste un protocollo universale per i cookie.</p>
<p>I cookie sono solitamente associati ai rispettivi domini; possono quindi essere letti e manipolati solo dal server che li ha prodotti.</p>
<p>D’altro canto, i cookie prodotti da server che fanno parte dello stesso ecosistema o che appartengono a realtà che collaborano tra loro, possono comunicare tra loro (e lo fanno).</p>

<p>Andiamo su un sito chiamato “coolrollerblades.com”, ma non acquistiamo nulla.</p>
<p>Poi saliamo su Instagram, e vediamo degli annunci riguardanti vari pattini molto simili a quelli che abbiamo visto sull’altro sito.</p>

<h3 id="cookie-di-terze-parti-1">Cookie di terze parti</h3>
<p>Immaginiamo di andare dal dentista.</p>
<p>Alla fine della visita, il dentista ci comunica che dobbiamo utilizzare l’apparecchio.</p>
<p>Il dentista inoltra la nostra cartella contenente le scannerizzazioni a raggi X ad un ortodentista che ci aiuterà con il nostro apparecchio.</p>
<p>La stessa cosa avviene tra siti e servizi di aziende e istituzioni diverse, che usano cookie per scambiarsi informazioni.</p>

<h3 id="la-questione-della-privacy">La questione della privacy</h3>
<p>Il punto in cui la nostra metafora viene meno. La maggior parte delle persone direbbe che una visita annuale dal medico è indiscutibilmente una cosa buona.</p>
<p>D’altra parte, c’è un po’ più di dibattito sulle questioni relative alla privacy che accompagnano i cookie. La maggior parte delle persone è a proprio agio con un sito che utilizza le loro informazioni per facilitare il processo di autenticazione ai propri siti.</p>

<p>Ma sempre più persone si stanno rendendo conto che questa condivisione sta prendendo pieghe inquietanti.</p>

<h3 id="il-legittimo-interesse">Il legittimo interesse</h3>
<p>Il <strong>legittimo interesse</strong> è <em>il trattamento necessario per il perseguimento del legittimo interesse del titolare del trattamento o di terzi</em>.</p>
<p>Il &quot;titolare del trattamento&quot; è un sito web o un'azienda che tratta dati personali, come fornitori di servizi o inserzionisti.</p>
<p>Tra tutte le basi giuridiche del GDPR, il legittimo interesse è la più ambigua, poiché consente ampie interpretazioni per diversi scopi di trattamento.</p>

<h3 id="il-legittimo-interesse-1">Il legittimo interesse</h3>
<p>Sebbene i legittimi interessi consentano ai titolari di trattare i dati senza il permesso esplicito dell'utente, quest'ultimo ha il diritto di opporsi. Di conseguenza, i legittimi interessi compaiono sempre più spesso nelle informative sulla privacy.</p>
<p>Il potenziale sfruttamento dei legittimi interessi per raccogliere più dati si collega al design ingannevole, onnipresente nelle informative sulla privacy e nei banner dei cookie.</p>
